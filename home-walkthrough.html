<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Home Walkthrough</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #f4efe6; --dim: #c9c0b1; --panel: rgba(24, 20, 17, 0.62); --line: rgba(244, 239, 230, 0.16);
    --brass: #d2a85c; --brass-ink: #1d1712;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14110f; color: var(--ink);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #caption { position: fixed; left: 16px; top: 16px; padding: 10px 14px 11px; min-width: 150px; pointer-events: none;
    transition: opacity .35s; }
  #caption .name { font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  #caption .size { color: var(--dim); font-size: 13px; margin-top: 1px; font-variant-numeric: tabular-nums; }
  #caption .tag { color: var(--brass); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
  #mapwrap { position: fixed; right: 16px; top: 16px; padding: 8px; }
  #map { display: block; width: 132px; height: 216px; }
  #bar { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }
  #row1 { display: flex; align-items: center; gap: 10px; }
  #row0 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #row0 .lbl { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
  #row0 .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  #row0 .seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 12px; }
  #row0 .seg button + button { border-left: 1px solid var(--line); }
  #row0 button.on { background: var(--ink); color: var(--brass-ink); }
  #row0 .gap { flex: 1; }
  button { font: inherit; color: var(--ink); background: rgba(244, 239, 230, 0.08); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(244, 239, 230, 0.16); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  #play { background: var(--brass); color: var(--brass-ink); border-color: transparent; font-weight: 600; min-width: 118px; }
  #play:hover { background: #dfb76c; }
  #track { flex: 1; height: 6px; border-radius: 3px; background: rgba(244, 239, 230, 0.16); position: relative; cursor: pointer; min-width: 40px; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--brass); }
  #time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
  #stops { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  #stops::-webkit-scrollbar { display: none; }
  #stops button { padding: 5px 10px; font-size: 12.5px; color: var(--dim); }
  #stops button.on { color: var(--brass-ink); background: var(--ink); }
  /* time of day */
  #todwrap { display: flex; align-items: center; gap: 8px; }
  #todwrap .ends { display: flex; gap: 0; }
  #tod { -webkit-appearance: none; appearance: none; width: 190px; height: 6px; border-radius: 3px; cursor: pointer;
    background: linear-gradient(90deg, #f6d9a8 0%, #cfe3f6 30%, #f1c98e 55%, #e8843c 72%, #46386a 86%, #10142c 100%); }
  #tod::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 2px solid var(--brass-ink); box-shadow: 0 0 0 1px var(--line); }
  #tod::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 2px solid var(--brass-ink); }
  #todlbl { color: var(--dim); font-size: 12.5px; min-width: 132px; font-variant-numeric: tabular-nums; }
  #todwrap button { padding: 5px 8px; font-size: 12px; color: var(--dim); }
  /* floor buttons appear with the dollhouse view */
  #floors { display: none !important; }
  body.doll:not(.onefloor) #floors { display: flex !important; }
  /* big Start Tour button and the label shown at each stop */
  #start { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); padding: 14px 26px; font-size: 17px; font-weight: 600;
    background: var(--brass); color: var(--brass-ink); border-color: transparent; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
    transition: opacity .4s, transform .4s; }
  #start:hover { background: #dfb76c; }
  #start.gone { opacity: 0; pointer-events: none; transform: translate(-50%, 12px); }
  #label { position: fixed; left: 50%; bottom: 196px; transform: translateX(-50%); padding: 12px 18px 13px; text-align: center; pointer-events: none;
    min-width: 240px; max-width: min(460px, calc(100% - 24px)); transition: opacity .5s, transform .5s; }
  #label.hide { transform: translate(-50%, 10px); }
  #label .f { color: var(--brass); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  #label .n { font-size: 20px; font-weight: 600; margin-top: 1px; }
  #label .a { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 1px; }
  #label .s { color: var(--dim); font-size: 13.5px; margin-top: 5px; }
  #hint { position: fixed; left: 50%; bottom: 168px; transform: translateX(-50%); padding: 7px 12px; font-size: 12.5px;
    color: var(--dim); pointer-events: none; transition: opacity .6s; text-align: center; max-width: calc(100% - 24px); width: max-content; }
  @media (pointer: coarse) { #hint .kb { display: none; } }
  #fade { position: fixed; inset: 0; background: #0d0b0a; opacity: 0; pointer-events: none; transition: opacity .55s; }
  #loading { position: fixed; inset: 0; background: #14110f; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; transition: opacity .6s; }
  #loading .t { font-size: 20px; font-weight: 600; }
  #loading .s { color: var(--dim); }
  #end { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 18px 20px; text-align: center;
    display: none; }
  #end .t { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  #end .s { color: var(--dim); margin-bottom: 12px; }
  #end button { margin: 0 3px; }
  #editlink { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; white-space: nowrap; background: rgba(244, 239, 230, 0.08); }
  #editlink:hover { background: rgba(244, 239, 230, 0.16); }
  #notice { position: fixed; left: 16px; top: 92px; max-width: 300px; padding: 8px 12px; font-size: 12.5px; color: var(--dim); display: none; }
  #notice a { color: var(--brass); }
  .hide { opacity: 0 !important; }
  @media (max-width: 760px) {
    #caption { left: 10px; top: 10px; } #mapwrap { right: 10px; top: 10px; padding: 6px; }
    #map { width: 92px; height: 151px; } #bar { left: 10px; right: 10px; bottom: 10px; }
    #time, #editlink, #todwrap .ends { display: none; } #hint { display: none; } #play { min-width: 104px; }
    #tod { width: 120px; } #todlbl { min-width: 0; } #start { bottom: 250px; } #label { bottom: 240px; }
  }
  body.debug .panel, body.debug #hint, body.debug #start { display: none !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="caption" class="panel"><div class="tag">Ground floor</div><div class="name">&nbsp;</div><div class="size">&nbsp;</div></div>
<div id="mapwrap" class="panel"><canvas id="map" width="264" height="432"></canvas></div>
<div id="hint" class="panel">Drag to look, or press Mouse look <span class="kb">&nbsp;·&nbsp; W A S D to walk</span> &nbsp;·&nbsp; tap the floor to move</div>
<div id="label" class="panel hide"><div class="f">&nbsp;</div><div class="n">&nbsp;</div><div class="a">&nbsp;</div><div class="s">&nbsp;</div></div>
<button id="start" type="button">▶&nbsp; Start Tour</button>

<div id="bar" class="panel">
  <div id="row0">
    <span class="lbl">Style</span>
    <div class="seg"><button type="button" data-style="modern">Modern</button><button type="button" data-style="scandi">Scandinavian</button><button type="button" data-style="luxury">Warm luxury</button></div>
    <div id="todwrap">
      <span class="lbl" style="margin-left:6px">Time</span>
      <input id="tod" type="range" min="0" max="1000" step="1" value="550" aria-label="Time of day, from morning to night">
      <span id="todlbl">&nbsp;</span>
      <span class="ends"><button type="button" data-tod="0" title="Morning">Morning</button><button type="button" data-tod="0.72" title="Sunset">Sunset</button><button type="button" data-tod="1" title="Night">Night</button></span>
    </div>
    <span class="gap"></span>
    <button id="mute" type="button" title="Background music, made in the browser. Starts with the tour.">♪ Music on</button>
    <button id="mlook" type="button" title="Capture the mouse to look around; Esc releases it">Mouse look</button>
    <div class="seg" id="floors"><button type="button" data-floor="ground">Ground floor</button><button type="button" data-floor="first">First floor</button></div>
    <button id="doll" type="button" title="See the home from above with the roof off">Dollhouse view</button>
  </div>
  <div id="row1">
    <button id="play" type="button">▶ Start tour</button>
    <button id="restart" type="button" title="Start again">Restart</button>
    <div id="track"><div id="fill"></div></div>
    <div id="time">0:00 / 0:00</div>
  </div>
  <div id="stops"></div>
</div>

<div id="end" class="panel">
  <div class="t">Tour complete</div>
  <div class="s">Drag to turn the home, walk around on your own, or watch it again.</div>
  <button id="again" type="button">Watch again</button>
  <button id="explore" type="button">Explore</button>
</div>

<div id="notice" class="panel"></div>
<div id="fade"></div>
<div id="loading"><div class="t">Home Walkthrough</div><div class="s" id="loadmsg">Building the model…</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>

<script>
/* ---- js/plan.js ---- */
/* Turns the editable plans (plan-data.js for the first floor, plan-data-ground.js
   for the ground floor, or the copies saved by the plan editor in this browser)
   into everything the 3D model needs. Units are feet; see plan-data.js for the
   axes. Heights are measured up from the first floor finish, so the ground floor
   sits at a negative height (GF). */
(function () {
  const A = (window.APP = window.APP || {});
  const KEY = 'arch.plan.firstfloor', GKEY = 'arch.plan.ground';
  A.PLAN_KEY = KEY;
  A.PLAN_KEY_G = GKEY;

  // Used when a plan file or a saved copy has no "areas" list yet.
  A.DEFAULT_AREAS = [
    { id: 'void', name: 'Double Height', kind: 'void', r: [9.375, 14.625, 26.125, 24.375] },
    { id: 'terrace', name: 'Terrace', kind: 'terrace', r: [0, 28.625, 8.875, 39] },
    { id: 'terrace-strip', name: 'Terrace', kind: 'terrace', r: [5.39, 39, 8.875, 47] },
    { id: 'front-balcony', name: 'Front Balcony', kind: 'balcony', r: [5.39, 47, 30.375, 50.54] },
    { id: 'rear-balcony', name: 'Rear Balcony', kind: 'balcony', r: [-3.5, -2, 30.375, 0] },
    { id: 'north-balcony', name: 'Rear Balcony', kind: 'balcony', r: [-3.5, 0, -1, 14.625] },
  ];

  A.DEFAULT_WARDROBES = [
    { id: 'dress-wardrobe-1', r: [22.625, 44.25, 29.25, 46.25], face: 'rear' },

  function chosen(base, key) {
    if (!base) return null;

      const q = new URLSearchParams(location.search);

      if (s) {

  }

  const G = chosen(window.PLAN_DATA_GROUND || null, GKEY);   // null when the home has no ground floor drawing

  const H = +D.H || 11;                 // first floor: floor to ceiling
  const SLAB = D.SLAB;                  // slab thickness (assumed)
  const HG = G ? +G.H || H : H;         // ground floor: floor to ceiling
  const GF = -(HG + SLAB);              // ground floor level below the first floor
  const PORCH = -1.5;                   // car porch, below the ground floor finish
  const DOOR = D.DOOR;                  // door and window head height (assumed)
  const zval = (v) => (v === 'GF' ? GF : v === 'H' ? H : v === 'TOP' ? H + SLAB : v === '-SLAB' ? -SLAB : +v);
  // With a real ground floor below, first-floor pieces stop at the underside of their own slab.
  const zr = (z) => { const o = z ? [zval(z[0]), zval(z[1])] : [0, H]; if (G && o[0] < -SLAB) o[0] = -SLAB; return o; };

  const walls = D.walls.filter((w) => !(G && w.hidden)).map((w) => ({
    id: w.id, ax: w.ax, r: w.r.slice(), z: zr(w.z), base: 0, mat: w.mat || 'wall',
    ops: (w.ops || []).map((o) => Object.assign({}, o, { head: Math.min(o.head, zr(w.z)[1]) })),
  })).filter((w) => w.z[1] - w.z[0] > 0.01);
  const pillars = D.pillars.map((p) => ({ id: p.id, r: p.r.slice(), z: zr(p.z), mat: p.mat || 'wall' }));
  const areaList = (D.areas || A.DEFAULT_AREAS).map((a) => ({ id: a.id, name: a.name || a.id, kind: a.kind, r: a.r.slice() }));
  const areaById = {};
  for (const a of areaList) areaById[a.id] = a;
  // Wardrobes: footprint, the side the doors are on, and height (ceiling if not given).
  const wardrobes = (D.wardrobes || A.DEFAULT_WARDROBES).map((w) => ({ id: w.id, r: w.r.slice(), face: w.face || 'rear', h: Math.min(+w.h || H, H), mirror: !!w.mirror }));
  const voids = areaList.filter((a) => a.kind === 'void');
  const outdoor = areaList.filter((a) => a.kind !== 'void');

  // --- small rectangle kit ----------------------------------------------------
  const inRect = (x, y, r) => x > r[0] && x < r[2] && y > r[1] && y < r[3];
  function subtract(rects, hole) {
    const out = [];
    for (const r of rects) {
      const x0 = Math.max(r[0], hole[0]), y0 = Math.max(r[1], hole[1]), x1 = Math.min(r[2], hole[2]), y1 = Math.min(r[3], hole[3]);
      if (x1 <= x0 + 1e-6 || y1 <= y0 + 1e-6) { out.push(r); continue; }
      if (r[1] < y0) out.push([r[0], r[1], r[2], y0]);
      if (y1 < r[3]) out.push([r[0], y1, r[2], r[3]]);
      if (r[0] < x0) out.push([r[0], y0, x0, y1]);
      if (x1 < r[2]) out.push([x1, y0, r[2], y1]);

  /* Edges of a set of floor rectangles that need a railing. needsRail(x, y, nx, ny)
     is asked about each edge piece, n being the direction away from the floor.
     Returns [{ dir, c, a, b, n }]: dir "y" runs along Y at X = c, dir "x" along X at Y = c. */
  function boundary(rects, needsRail, cutsX, cutsY) {
    const xs = uniq(rects.flatMap((r) => [r[0], r[2]]).concat(cutsX || [])), ys = uniq(rects.flatMap((r) => [r[1], r[3]]).concat(cutsY || []));
    const inside = (x, y) => rects.some((r) => inRect(x, y, r));
    const raw = [], e = 0.03;
    for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
      const cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2;
      if (!inside(cx, cy)) continue;
      if (!inside(xs[i] - e, cy) && needsRail(xs[i], cy, -1, 0)) raw.push(['y', xs[i], ys[j], ys[j + 1], -1]);
      if (!inside(xs[i + 1] + e, cy) && needsRail(xs[i + 1], cy, 1, 0)) raw.push(['y', xs[i + 1], ys[j], ys[j + 1], 1]);
      if (!inside(cx, ys[j] - e) && needsRail(cx, ys[j], 0, -1)) raw.push(['x', ys[j], xs[i], xs[i + 1], -1]);
      if (!inside(cx, ys[j + 1] + e) && needsRail(cx, ys[j + 1], 0, 1)) raw.push(['x', ys[j + 1], xs[i], xs[i + 1], 1]);
    }
    raw.sort((p, q) => (p[0] < q[0] ? -1 : p[0] > q[0] ? 1 : p[1] - q[1] || p[4] - q[4] || p[2] - q[2]));
    const out = [];
    for (const s of raw) {
      const last = out[out.length - 1];
      if (last && last.dir === s[0] && Math.abs(last.c - s[1]) < 1e-6 && last.n === s[4] && Math.abs(last.b - s[2]) < 1e-6) last.b = s[3];
      else out.push({ dir: s[0], c: s[1], a: s[2], b: s[3], n: s[4] });
    }
    return out;
  }

  // --- fixed parts of the building (not in the editor) -----------------------
  const ZONE = [-0.375, 14.625, 30.375, 27.875];   // lounge + gallery + void + main stair
  const STAIRWELL = [[20.29, 24.375, 30.375, 27.875], [26.125, 14.625, 30.375, 24.375]];
  // Floor of the middle zone: everything that is not the void or the stairwell.
  let midFloor = [ZONE];
  for (const v of voids) midFloor = subtract(midFloor, v.r);
  for (const s of STAIRWELL) midFloor = subtract(midFloor, s);

  const indoorSlabs = [
    [-1, 0, 30.375, 14.625],          // rear block
    [-0.375, 27.875, 8.875, 28.625],  // under the lounge / terrace wall
    [8.875, 27.875, 30.375, 47],      // master suite
  ];
  // Structural slab pieces (top just below finish level).
  const slabs = indoorSlabs.concat(midFloor, outdoor.map((a) => a.r));
  // The front stair (drawn on the ground floor) climbs to a landing beside the front
  // balcony at first floor level, then on to the roof.
  const FRONT_LANDING = G ? [19.375, 47, 22.13, 52.75] : null;
  if (FRONT_LANDING) slabs.push(FRONT_LANDING);

  // Finish floors of the rooms: [x0, y0, x1, y1, material]
  const roomFloors = [
    [-0.25, 0.375, 19.25, 14.25, 'marble'],       // living and dining
    [-0.25, 14.25, 13.72, 14.625, 'marble'],      // where the wall to the lounge was taken out
    [19.25, 0.75, 29.625, 7.75, 'marble'],        // kitchen
    [27.125, 7.75, 29.625, 14.25, 'marble'],      // kitchen utility leg
    [19.2085, 8.125, 26.75, 14.25, 'bathfloor'],  // common washroom
    [9.25, 28.25, 22.25, 46.25, 'woodfloor'],     // master bedroom
    [22.625, 38.25, 29.625, 46.25, 'woodfloor'],  // dress
    [22.625, 28.25, 29.625, 37.875, 'bathfloor'], // master toilet
  ];
  const floors = roomFloors
    .concat(midFloor.map((r) => [r[0], r[1], r[2], r[3], 'marble']))
    .concat(outdoor.map((a) => [a.r[0], a.r[1], a.r[2], a.r[3], a.kind === 'terrace' ? 'deck' : 'stonefloor']));

  // Ceilings at H, plus a roof projection over the front balcony.
  const ceilings = [
    [-1, 0, 30.375, 14.625],
    [-0.375, 14.625, 30.375, 27.875],
    [-0.375, 27.875, 8.875, 28.625],
    [8.875, 27.875, 30.375, 47],

  const ft = (v) => { const t = Math.round(Math.abs(v) * 24), f = Math.floor(t / 24), h = t - f * 24; return f + "'-" + Math.floor(h / 2) + (h % 2 ? '½' : '') + '"'; };
  const rooms = [
    { name: 'Living & Dining', size: "19'-6\" × 13'-10½\", open to the lounge", r: [-0.25, 0.375, 19.25, 14.625] },
    { name: 'Kitchen', size: "10'-4½\" × 7'-0\" + utility 2'-6\" × 6'-6\"", r: [19.25, 0.75, 29.625, 7.75] },
    { name: 'Kitchen', size: "10'-4½\" × 7'-0\" + utility 2'-6\" × 6'-6\"", r: [27.125, 7.75, 29.625, 14.25] },
    { name: 'Common Washroom', size: "7'-6\" × 6'-1½\"", r: [19.2085, 8.125, 26.75, 14.25] },
    { name: 'Master Bedroom', size: "13'-0\" × 18'-0\"", r: [9.25, 28.25, 22.25, 46.25] },
    { name: 'Dress', size: "7'-0\" × 8'-0\"", r: [22.625, 38.25, 29.625, 46.25] },
    { name: 'Master Toilet', size: "7'-0\" × 9'-7½\"", r: [22.625, 28.25, 29.625, 37.875] },

  for (const a of areaList) rooms.push({ name: a.name, size: ft(a.r[2] - a.r[0]) + ' × ' + ft(a.r[3] - a.r[1]), r: a.r, area: true });
  rooms.push(
    { name: 'Main Stair', size: "3'-6\" wide", r: [20.29, 24.375, 29.625, 27.875] },
    { name: 'Main Stair', size: "3'-6\" wide", r: [23.6, 14.625, 29.625, 24.375] },
    { name: 'Family Lounge', size: "12'-10\" × 13'-3\"", r: [0.375, 14.625, 13.2, 27.875] },
    { name: 'Gallery', size: "beside the double height", r: [9.375, 14.625, 29.625, 27.875] }
  );
  if (FRONT_LANDING) rooms.unshift({ name: 'Front Stair', size: 'ground floor, balcony and roof', r: [19.375, 47, 29.625, 52.75] });

  /* Where there is a floor to stand on: [x0, y0, x1, y1, height]. Height may be

  const areas = slabs.map((s) => [s[0], s[1], s[2], s[3], 0]).concat([
    [20.29, 24.375, 26.125, 27.875, f1],      // main stair, top flight

    [26.125, 18.125, 29.625, 23.96, f2],

  const solids = [];

      const piece = (a, b, za, zb) => { if (b - a > 1e-4 && zb - za > 1e-4) solids.push(w.ax === 'x' ? [a, y0, b, y1, za, zb] : [x0, a, x1, b, za, zb]); };
      // cut the wall at every opening edge; in each stretch, leave out the open (walkable) heights
      const cuts = Array.from(new Set([lo, hi].concat(w.ops.flatMap((o) => [o.a, o.b])).filter((v) => v >= lo && v <= hi))).sort((p, q) => p - q);
      for (let i = 0; i < cuts.length - 1; i++) {
        const a = cuts[i], b = cuts[i + 1], mid = (a + b) / 2;
        const holes = w.ops.filter((o) => o.a < mid && o.b > mid && (o.type === 'open' || ((o.type === 'door' || o.type === 'gdoor') && o.isOpen)))
          .map((o) => [base + (o.sill || 0), base + o.head]).sort((p, q) => p[0] - q[0]);
        let cur = z0;
        for (const [h0, h1] of holes) { piece(a, b, cur, Math.max(cur, h0)); cur = Math.max(cur, h1); }
        piece(a, b, cur, z1);
      }
    }
    for (const p of pillarList) solids.push([p.r[0], p.r[1], p.r[2], p.r[3], p.z[0], p.z[1]]);
  }
  addSolids(walls, pillars);

  // --- railings, worked out from the floor edges ------------------------------
  // Glass railing wherever first-floor floor meets the void or the stairwell,
  // except across the top step of the main stair.
  const holes = voids.map((v) => v.r).concat(STAIRWELL);
  const glass = boundary(midFloor, (x, y, nx, ny) => {
    const qx = x + nx * 0.05, qy = y + ny * 0.05;
    if (!holes.some((h) => inRect(qx, qy, h))) return false;
    if (nx === 1 && Math.abs(x - 20.29) < 0.01 && y > 24.375 && y < 27.875) return false;
    return true;
  });
  // Jaali railing on every open edge of a terrace or balcony: not where it meets
  // the building, another open area, or a wall / parapet / pillar.
  const guards = walls.concat(pillars).filter((w) => w.z[0] < 0.5 && w.z[1] > 3).map((w) => w.r);
  const jaali = boundary(outdoor.map((a) => a.r), (x, y, nx, ny) => {
    const ox = x + nx * 0.1, oy = y + ny * 0.1, ix = x - nx * 0.1, iy = y - ny * 0.1;
    if (slabs.some((s) => inRect(ox, oy, s))) return false;
    if (guards.some((g) => inRect(ox, oy, g) || inRect(ix, iy, g))) return false;
    return true;
  }, guards.flatMap((g) => [g[0], g[2]]), guards.flatMap((g) => [g[1], g[3]]));

  const v0 = voids[0];
  const voidCenter = v0 ? [(v0.r[0] + Math.min(v0.r[2], 24.5)) / 2, (v0.r[1] + v0.r[3]) / 2] : [17, 19.6];

  // ===== ground floor ===========================================================
  let ground = null;
  if (G) {
    const gv = (v) => (v === 'H' ? HG : v === 'PORCH' ? PORCH : v === 'TOP' ? HG + SLAB : v === 'ROOF' ? HG + SLAB + H + SLAB : +v);
    const gzr = (z) => (z ? [GF + gv(z[0]), GF + gv(z[1])] : [GF, GF + HG]);
    const gwalls = G.walls.map((w) => {
      const z = gzr(w.z);
      return { id: w.id, ax: w.ax, r: w.r.slice(), z, base: GF, grp: 'gmain', mat: w.mat || 'wall',
        ops: (w.ops || []).map((o) => Object.assign({}, o, { head: Math.min(o.head, z[1] - GF) })) };
    });
    const gpillars = G.pillars.map((p) => ({ id: p.id, r: p.r.slice(), z: gzr(p.z), mat: p.mat || 'wall', grp: 'gmain' }));
    const gareas = (G.areas || []).map((a) => ({ id: a.id, name: a.name || a.id, kind: a.kind, r: a.r.slice(), lvl: GF + (a.kind === 'porch' ? PORCH : 0) }));
    const gwardrobes = (G.wardrobes || []).map((w) => ({ id: w.id, r: w.r.slice(), face: w.face || 'rear', h: Math.min(+w.h || HG, HG), mirror: !!w.mirror }));

    // Solid base under the building, up to the floor finish.
    const indoor = [[-1, 0, 30.375, 14.625], [-0.375, 14.625, 30.375, 28.625], [7.75, 28.625, 30.375, 39], [15.875, 39, 30.375, 47]];
    const plinth = [[19, 47, 30.375, 53.5]].concat(gareas.filter((a) => a.kind !== 'porch').map((a) => a.r));
    // Finish floors of the rooms: [x0, y0, x1, y1, material]
    const gRoomFloors = [
      [0.375, 14.625, 29.625, 27.875, 'marble'],      // living / dining hall
      [-0.25, 4.75, 12.885, 14.25, 'woodfloor'],      // children's bedroom
      [-0.25, 0.375, 4.75, 4.375, 'marble'],          // pooja
      [13.26, 0.75, 19.25, 4.375, 'marble'],          // store
      [15.26, 4.375, 19.25, 6.38, 'marble'],
      [13.26, 9.5, 19.25, 14.25, 'bathfloor'],        // common toilet
      [15.26, 6.75, 19.25, 9.5, 'bathfloor'],         // w.c.
      [19.625, 0.75, 29.625, 14.25, 'woodfloor'],     // guest bedroom
      [8.5, 28.25, 15.875, 38.25, 'marble'],          // kitchen
      [16.25, 28.25, 19.75, 33.25, 'marble'],         // passage
      [20.125, 28.25, 29.625, 33.25, 'bathfloor'],    // toilet (the duct was taken out)
      [16.25, 33.25, 19.75, 33.625, 'woodfloor'],     // passage opens into the master bedroom
      [16.25, 33.625, 29.25, 46.25, 'woodfloor'],     // master bedroom
    ];
    // Steps between the porch and the raised floor: [x0, y0, x1, y1, top above the ground floor]
    const steps = [
      [0.375, 33.13, 7.75, 33.965, -0.5], [0.375, 33.965, 7.75, 34.8, -1.0],
      [12, 49.14, 15.875, 49.97, -0.5], [12, 49.97, 15.875, 50.8, -1.0],
    ];
    const sq = (w, d) => Math.round(w * d) + ' sq ft';
    const grooms = [
      { name: 'Living / Dining Hall', size: "25'-4½\" × 13'-3\" · " + sq(25.375, 13.25), r: [0.375, 14.625, 29.625, 27.875] },
      { name: "Children's Bedroom", size: "13'-1½\" × 9'-6\" · " + sq(13.125, 9.5), r: [-0.25, 4.75, 12.885, 14.25] },
      { name: 'Pooja', size: "5'-0\" × 4'-0\" · 20 sq ft", r: [-0.25, 0.375, 4.75, 4.375] },
      { name: 'Store', size: "6'-0\" × 3'-7½\"", r: [13.26, 0.75, 19.25, 6.38] },
      { name: 'Common Toilet', size: "6'-0\" × 4'-9\" + W.C. 4'-0\" × 2'-9\"", r: [13.26, 6.75, 19.25, 14.25] },
      { name: 'Guest Bedroom', size: "10'-0\" × 11'-6\" · " + sq(10, 11.5), r: [19.625, 0.75, 29.625, 14.25] },
      { name: 'Kitchen', size: "7'-4½\" × 10'-0\" · " + sq(7.375, 10), r: [8.5, 28.25, 15.875, 38.25] },
      { name: 'Passage', size: "3'-6\" wide", r: [16.25, 28.25, 19.75, 33.25] },
      { name: 'Toilet', size: "9'-6\" × 5'-0\" · " + sq(9.5, 5), r: [20.125, 28.25, 29.625, 33.25] },
      { name: 'Master Bedroom', size: "13'-0\" × 10'-7½\" · " + sq(13, 10.625), r: [16.25, 33.625, 29.25, 46.25] },
    ];
    // the car porch is drawn as a few rectangles: its caption gives the whole porch, as on the drawing
    for (const a of gareas) grooms.push({ name: a.name, size: a.kind === 'porch' ? "11'-7½\" × 14'-6\" · 169 sq ft" : ft(a.r[2] - a.r[0]) + ' × ' + ft(a.r[3] - a.r[1]), r: a.r, area: true });
    grooms.push({ name: 'Front Stair', size: 'to the first floor and the roof', r: [19, 47, 29.625, 52.75] });
    grooms.push({ name: 'Road', size: "in front of the house (west) · plot 30' × 54'-6\"", r: [-40, 54.5, 70, 78] });

    // Where you can stand on the ground floor.
    const ramp = (y0, y1) => (x, y) => GF + PORCH * clamp01((y - y0) / (y1 - y0));
    areas.push(
      [-0.25, 0.375, 29.625, 14.625, GF],             // rear block
      [0.375, 14.25, 23.62, 28.625, GF],              // hall, up to the foot of the main stair
      [23.62, 18.125, 26.125, 28.25, GF],
      [7.75, 27.875, 29.625, 39, GF],                 // kitchen, passage, toilet
      [15.875, 39, 29.625, 46.25, GF],                // master bedroom
      [0.375, 33.13, 7.75, 34.8, ramp(33.13, 34.8)],  // lobby steps
      [12, 49.14, 15.875, 50.8, ramp(49.14, 50.8)]    // walkway steps
    );
    for (const a of gareas) areas.push([a.r[0], a.r[1], a.r[2], a.r[3], a.lvl]);
    const ROAD = GF + PORCH - 0.25;                                // road surface, a little below the porch
    areas.push([-40, 54.5, 70, 78, ROAD]);
    for (const [tx, ty, ts] of [[-12, 58, 0.8], [40, 58.5, 0.9]]) solids.push([tx - 0.75 * ts, ty - 0.75 * ts, tx + 0.75 * ts, ty + 0.75 * ts, ROAD - 1, ROAD + 9]);
    addSolids(gwalls, gpillars);
    /* Front stair: two runs, each a flight heading south, three winders and a
       flight heading back north. The first run reaches the landing beside the
       front balcony, the second the roof. */
    const TOP = H + SLAB, FX0 = 22.13, FX1 = 22.13 + 6 * (9.5 / 12), RF = -GF / 16, RT = TOP / 16;
    const frontRun = (base, R) => [
      [FX0, 47, FX1, 49.76, (x) => base + clamp01((x - FX0) / (FX1 - FX0)) * 6 * R],
      [FX1, 47, 29.625, 52.75, (x, y) => base + (6 + 3 * clamp01((y - 47) / 5.75)) * R],
      [FX0, 50.01, FX1, 52.75, (x) => base + (9 + 6 * clamp01((FX1 - x) / (FX1 - FX0))) * R],
    ];
    areas.push([19, 47, FX0, 50, GF]);                           // through the stair door and inside it
    areas.push(...frontRun(GF, RF), ...frontRun(0, RT));
    areas.push([19.375, 47, FX0, 52.75, TOP]);                   // landing on the roof
    const roof = ceilings.slice(0, 4);
    for (const c of roof) areas.push([c[0], c[1], c[2], c[3], TOP]);
    solids.push([FX0, 49.76, FX1, 50.01, GF, TOP]);              // the wall between the flights
    // a 3 ft parapet round the roof, open only where the stair landing joins it
    const parapet = boundary(roof, (x, y, nx, ny) => !(ny === 1 && Math.abs(y - 47) < 0.01 && x > 19.375 && x < FX0));
    for (const s of parapet) {
      const t = 0.375, a = s.c - (s.n > 0 ? t : 0), b = s.c + (s.n < 0 ? t : 0);
      solids.push(s.dir === 'y' ? [a, s.a, b, s.b, TOP, TOP + 3] : [s.a, a, s.b, b, TOP, TOP + 3]);
    }
    A.frontStair = { X0: FX0, X1: FX1, RF, RT, TOP, parapet };

    ground = {
      H: HG, PORCH, walls: gwalls, pillars: gpillars, areaList: gareas, wardrobes: gwardrobes, plinth, indoor,
      roomFloors: gRoomFloors, steps, rooms: grooms,
      floors: gRoomFloors.map((f) => [f[0], f[1], f[2], f[3], f[4], GF]).concat(gareas.map((a) => [a.r[0], a.r[1], a.r[2], a.r[3], 'stonefloor', a.lvl])),
    };
  }

  A.plan = {
    H, SLAB, GF, HG, PORCH, DOOR, RISE, TREAD, walls, pillars, slabs, floors, roomFloors, ceilings, rooms, areas, solids,
    areaList, areaById, voids, midFloor, wardrobes, ZONE, STAIRWELL, rails: { glass, jaali }, voidCenter, ground,
  };
})();

<script>
/* ---- js/materials.js ---- */
/* Procedural textures and the material palette: warm contemporary with Jaipur touches. */
(function () {
  const A = (window.APP = window.APP || {});
  const T = THREE;

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function tex(size, draw, seed) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    draw(g, size, rng(seed || 1));
    const t = new T.CanvasTexture(c);
    t.colorSpace = T.SRGBColorSpace;
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.anisotropy = 8;
    return t;
  }

  function clouds(g, s, R, n, cols, amin, amax) {
    for (let i = 0; i < n; i++) {
      const x = R() * s, y = R() * s, r = s * (0.04 + R() * 0.14);
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      const c = cols[(R() * cols.length) | 0], a = amin + R() * (amax - amin);
      gr.addColorStop(0, `rgba(${c},${a})`);
      gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  }
  function speckle(g, s, R, n, col, a) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = `rgba(${col},${R() * a})`;
      g.fillRect(R() * s, R() * s, 1 + R() * 2, 1 + R() * 2);
    }
  }
  function grout(g, s, nx, ny, col, w) {
    g.fillStyle = col;
    for (let i = 0; i < nx; i++) g.fillRect((i * s) / nx - w / 2, 0, w, s);
    for (let j = 0; j < ny; j++) g.fillRect(0, (j * s) / ny - w / 2, s, w);
    g.fillRect(s - w / 2, 0, w, s);
    g.fillRect(0, s - w / 2, s, w);
  }

  function marble(g, s, R, base, vein, nx, ny) {
    g.fillStyle = base;
    g.fillRect(0, 0, s, s);
    clouds(g, s, R, 70, ['255,255,255', '196,180,154'], 0.04, 0.1);
    for (let i = 0; i < 16; i++) {
      let x = R() * s, y = R() * s, ang = R() * Math.PI * 2;
      g.beginPath();
      g.moveTo(x, y);
      const n = 20 + R() * 30;
      for (let k = 0; k < n; k++) {
        ang += (R() - 0.5) * 0.7;
        x += Math.cos(ang) * 14;
        y += Math.sin(ang) * 14;
        g.lineTo(x, y);
      }
      g.strokeStyle = `rgba(${vein},${0.08 + R() * 0.16})`;
      g.lineWidth = 0.6 + R() * 1.8;
      g.stroke();
    }
    grout(g, s, nx, ny, 'rgba(120,108,92,0.55)', 2);
  }

  function wood(g, s, R, hue, sat, lum, plank, gap, vary) {
    for (let y = 0; y < s; y += plank) {
      let x = -R() * s * 0.5;
      while (x < s) {
        const len = s * (0.45 + R() * 0.5);
        g.fillStyle = `hsl(${hue + (R() - 0.5) * 6},${sat}%,${lum + (R() - 0.5) * vary}%)`;
        g.fillRect(x, y, len, plank);
        for (let k = 0; k < plank * 0.5; k++) {
          const yy = y + R() * plank;
          g.strokeStyle = `rgba(50,28,10,${0.03 + R() * 0.07})`;
          g.lineWidth = 0.5 + R();
          g.beginPath();
          g.moveTo(x, yy);
          g.bezierCurveTo(x + len * 0.3, yy + (R() - 0.5) * 4, x + len * 0.6, yy + (R() - 0.5) * 4, x + len, yy + (R() - 0.5) * 3);
          g.stroke();
        }
        g.fillStyle = `rgba(25,14,6,${gap})`;
        g.fillRect(x + len - 1.5, y, 1.5, plank);
        x += len;
      }
      g.fillStyle = `rgba(25,14,6,${gap})`;
      g.fillRect(0, y, s, 1.5);
    }
  }

  function stoneTile(g, s, R, base, nx, ny) {
    g.fillStyle = base;
    g.fillRect(0, 0, s, s);
    clouds(g, s, R, 50, ['255,235,220', '150,95,75'], 0.03, 0.08);
    speckle(g, s, R, 5000, '90,50,35', 0.12);
    speckle(g, s, R, 3000, '255,240,230', 0.12);
    grout(g, s, nx, ny, 'rgba(110,80,66,0.6)', 3);
  }

  function cladding(g, s, R) {
    g.fillStyle = '#8f8271';
    g.fillRect(0, 0, s, s);
    let y = 0;
    while (y < s) {
      const h = 14 + R() * 22;
      let x = -R() * 80;
      while (x < s) {
        const w = 60 + R() * 150;
        const l = 62 + R() * 16;
        g.fillStyle = `hsl(${32 + R() * 8},${18 + R() * 10}%,${l}%)`;
        g.fillRect(x + 1, y + 1, w - 2, h - 2);
        g.fillStyle = 'rgba(255,255,255,0.10)';
        g.fillRect(x + 1, y + 1, w - 2, 2);
        g.fillStyle = 'rgba(0,0,0,0.12)';
        g.fillRect(x + 1, y + h - 3, w - 2, 2);
        x += w;
      }
      y += h;
    }
    speckle(g, s, R, 6000, '60,45,30', 0.1);
  }

  function fluted(g, s, R) {
    const n = 16, w = s / n;
    for (let i = 0; i < n; i++) {
      const gr = g.createLinearGradient(i * w, 0, (i + 1) * w, 0);
      gr.addColorStop(0, '#5f4029');
      gr.addColorStop(0.25, '#a47550');
      gr.addColorStop(0.6, '#8b603f');
      gr.addColorStop(1, '#4b301d');
      g.fillStyle = gr;
      g.fillRect(i * w, 0, w + 1, s);
    }
    speckle(g, s, R, 4000, '40,22,10', 0.08);
  }

  function rug(g, s, R, bg, fg, ac) {
    g.fillStyle = bg;
    g.fillRect(0, 0, s, s);
    speckle(g, s, R, 9000, '255,255,255', 0.06);
    g.strokeStyle = fg;
    g.lineWidth = s * 0.012;
    g.strokeRect(s * 0.04, s * 0.04, s * 0.92, s * 0.92);
    g.lineWidth = s * 0.006;
    g.strokeRect(s * 0.075, s * 0.075, s * 0.85, s * 0.85);
    const n = 5, c = (s * 0.8) / n;
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++) {
        const cx = s * 0.1 + c * (i + 0.5), cy = s * 0.1 + c * (j + 0.5), r = c * 0.36;
        g.beginPath();
        g.moveTo(cx, cy - r); g.lineTo(cx + r, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r, cy);
        g.closePath();
        g.strokeStyle = (i + j) % 2 ? fg : ac;
        g.lineWidth = s * 0.006;
        g.stroke();
        g.fillStyle = (i + j) % 2 ? ac : fg;
        g.fillRect(cx - r * 0.14, cy - r * 0.14, r * 0.28, r * 0.28);
      }
  }

  function art(g, s, R, pal) {
    g.fillStyle = pal[0];
    g.fillRect(0, 0, s, s);
    for (let i = 0; i < 7; i++) {
      g.fillStyle = pal[1 + ((R() * (pal.length - 1)) | 0)];
      g.globalAlpha = 0.75 + R() * 0.25;
      if (R() < 0.5) {
        g.beginPath();
        g.arc(R() * s, R() * s, s * (0.1 + R() * 0.25), R() * 6.3, R() * 6.3);
        g.closePath();
        g.fill();
      } else {
        g.fillRect(R() * s * 0.8, R() * s * 0.8, s * (0.1 + R() * 0.4), s * (0.08 + R() * 0.3));
      }
    }
    g.globalAlpha = 1;
    speckle(g, s, R, 5000, '255,255,255', 0.08);
  }

  function jaali(g, s) {
    g.clearRect(0, 0, s, s);
    g.fillStyle = '#3b2f28';
    g.fillRect(0, 0, s, s);
    g.globalCompositeOperation = 'destination-out';
    const n = 2, c = s / n;
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++) {
        const cx = c * (i + 0.5), cy = c * (j + 0.5), r = c * 0.36;
        // eight-point star: two overlapping squares
        for (let k = 0; k < 2; k++) {
          g.save();
          g.translate(cx, cy);
          g.rotate((k * Math.PI) / 4);
          g.fillRect(-r * 0.78, -r * 0.78, r * 1.56, r * 1.56);
          g.restore();
        }
      }
    // small diamonds at the corners of each cell
    for (let i = 0; i <= n; i++)
      for (let j = 0; j <= n; j++) {
        g.save();
        g.translate(i * c, j * c);
        g.rotate(Math.PI / 4);
        g.fillRect(-c * 0.11, -c * 0.11, c * 0.22, c * 0.22);
        g.restore();
      }
    g.globalCompositeOperation = 'source-over';
  }

  A.texKit = { tex, marble, wood, rug, art };

  A.buildMaterials = function () {
    const M = {}, S = {}; // S = feet per texture repeat, used for world-scale UVs
    const std = (o) => new T.MeshStandardMaterial(o);

    const tMarble = tex(1024, (g, s, R) => marble(g, s, R, '#e9e2d5', '140,122,98', 2, 1), 11);
    const tBath = tex(512, (g, s, R) => marble(g, s, R, '#cfc8bb', '120,112,100', 2, 2), 12);
    const tBathW = tex(512, (g, s, R) => marble(g, s, R, '#e2dccf', '150,138,120', 1, 2), 13);
    const tWoodF = tex(1024, (g, s, R) => wood(g, s, R, 30, 36, 50, 128, 0.5, 9), 21);
    const tDeck = tex(512, (g, s, R) => wood(g, s, R, 28, 16, 42, 64, 0.8, 8), 22);
    const tTeak = tex(512, (g, s, R) => wood(g, s, R, 26, 44, 36, 512, 0, 3), 23);
    const tTeakV = tTeak.clone(); tTeakV.rotation = Math.PI / 2; tTeakV.needsUpdate = true;
    const tWalnut = tex(512, (g, s, R) => wood(g, s, R, 24, 30, 20, 512, 0, 3), 24);

    M.bathfloor = std({ map: tBath, roughness: 0.45 }); S.bathfloor = 4;

    M.deck = std({ map: tDeck, roughness: 0.8 }); S.deck = 3;
    M.stonefloor = std({ map: tStone, roughness: 0.85 }); S.stonefloor = 4;

    M.cladding = std({ map: tClad, roughness: 0.92 }); S.cladding = 5;

    M.glowSoft = std({ color: 0xfff1d6, emissive: 0xffd39a, emissiveIntensity: 0.9, roughness: 0.8 });
    // context
    M.ground = std({ color: 0xa7a38f, roughness: 1 });
    M.road = std({ color: 0x4a4a4c, roughness: 1 });
    M.grass = std({ color: 0x7c9462, roughness: 1 });
    M.trunk = std({ color: 0x6a4e37, roughness: 1 });
    M.nb1 = std({ color: 0xe6d9c6, roughness: 0.95 });
    M.nb2 = std({ color: 0xd9b8a3, roughness: 0.95 });
    M.nb3 = std({ color: 0xcfd6d2, roughness: 0.95 });
    M.nbwin = std({ color: 0x38454d, roughness: 0.2, metalness: 0.3 });

    const rugTex = (bg, fg, ac, seed) => { const t = tex(512, (g, s, R) => rug(g, s, R, bg, fg, ac), seed); t.wrapS = t.wrapT = T.ClampToEdgeWrapping; return t; };
    M.rugLiving = std({ map: rugTex('#b46a4c', '#f0e4cf', '#e3b65c', 41), roughness: 1 });
    M.rugLounge = std({ map: rugTex('#c7a04a', '#f3ead8', '#7a4a33', 42), roughness: 1 });
    M.rugBed = std({ map: rugTex('#6f8587', '#efe8da', '#d9c08a', 43), roughness: 1 });
    M.rugGF = std({ map: rugTex('#8b8478', '#e9e1d2', '#c7a877', 44), roughness: 1 });
    const artTex = (pal, seed) => { const t = tex(512, (g, s, R) => art(g, s, R, pal), seed); t.wrapS = t.wrapT = T.ClampToEdgeWrapping; return t; };
    M.art1 = std({ map: artTex(['#efe6d6', '#b8674a', '#c99a3c', '#3f6f73', '#2e2a28'], 51), roughness: 0.9 });
    M.art2 = std({ map: artTex(['#e9dfd0', '#3f6f73', '#d6a48c', '#c99a3c'], 52), roughness: 0.9 });
    M.art3 = std({ map: artTex(['#f1e9db', '#b8674a', '#8c9a84', '#2e2a28'], 53), roughness: 0.9 });
    M.art4 = std({ map: artTex(['#d9c9b0', '#7a4a33', '#3f6f73', '#f3ead8'], 54), roughness: 0.9 });

    // A fine woven texture on every fabric, so cushions, bedding and curtains read as cloth up close.
    const weave = (() => {
      const s = 256, c = document.createElement('canvas');
      c.width = c.height = s;
      const g = c.getContext('2d'), img = g.createImageData(s, s), R = rng(77);
      const cells = 32, hgt = new Float32Array(s * s);
      for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
        const fx = (x * cells) / s, fy = (y * cells) / s, ix = Math.floor(fx), iy = Math.floor(fy);
        const warp = (ix + iy) % 2 === 0;           // over-under weave
        const u = fx - ix, v = fy - iy;
        hgt[y * s + x] = (warp ? Math.sin(Math.PI * u) * (0.7 + 0.3 * Math.sin(Math.PI * v)) : Math.sin(Math.PI * v) * (0.7 + 0.3 * Math.sin(Math.PI * u))) + (R() - 0.5) * 0.25;
      }
      for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
        const hx = hgt[y * s + ((x + 1) % s)] - hgt[y * s + ((x - 1 + s) % s)], hy = hgt[((y + 1) % s) * s + x] - hgt[((y - 1 + s) % s) * s + x];
        const nx = -hx * 0.9, ny = -hy * 0.9, nz = 1, l = Math.hypot(nx, ny, nz), o = (y * s + x) * 4;
        img.data[o] = ((nx / l) * 0.5 + 0.5) * 255; img.data[o + 1] = ((ny / l) * 0.5 + 0.5) * 255; img.data[o + 2] = ((nz / l) * 0.5 + 0.5) * 255; img.data[o + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      const t = new T.CanvasTexture(c);
      t.wrapS = t.wrapT = T.RepeatWrapping;
      t.repeat.set(2.5, 2.5);
      t.anisotropy = 8;
      return t;
    })();
    for (const k of ['fabIvory', 'fabSand', 'fabTerra', 'fabMustard', 'fabTeal', 'fabGrey', 'fabWhite']) {
      M[k].normalMap = weave;
      M[k].normalScale.set(0.45, 0.45);
      M[k].roughness = 0.92;
    }

    for (const k in S) M[k].userData.s = S[k];
    A.M = M;
    A.S = S;
    return M;
  };
})();

/* ---- js/styles.js ---- */
/* Three interior styles for the same home. A style only changes finishes
   (paint, floor, timber, fabric, metal, rugs, art), so switching is instant. */
(function () {
  const A = (window.APP = window.APP || {});

  // wood = [hue, saturation %, lightness %]
  A.STYLES = {
    modern: {
      label: 'Modern', wall: 0xf3f3f1, ceiling: 0xfbfbfa,
      floor: { kind: 'stone', base: '#d9d9d6', vein: '96,98,104', rough: 0.2 },
      bedfloor: [28, 12, 40], wood: [24, 20, 26], dark: [20, 8, 13], flute: ['#1f2022', '#4a4c50', '#35373a', '#17181a'],
      accent: { c: 0x1d1d1f, r: 0.38, m: 0.85 }, frame: 0x151516, cab: 0x2f3337, counter: 0xf4f4f2,
      fab: { Ivory: 0xe8e8e5, Sand: 0xbfc1c2, Terra: 0x3b4046, Mustard: 0xc6c1b7, Teal: 0x2f4a66, Grey: 0x6f7377 },
      rugs: [['#3e4247', '#e6e6e3', '#9aa0a6'], ['#c9c9c5', '#3a3d41', '#2f4a66'], ['#55595f', '#e9e9e6', '#b9bcc0'], ['#8a8d91', '#ececea', '#3a3d41']],
      art: [['#ececea', '#1d1d1f', '#2f4a66', '#9aa0a6'], ['#dedede', '#2f4a66', '#1d1d1f', '#c6c1b7'], ['#f1f1ef', '#3b4046', '#9aa0a6', '#1d1d1f'], ['#cfd2d6', '#1d1d1f', '#2f4a66', '#f1f1ef']],
      clad: 0xc9ccd1, pot: 0x2b2b2d, glow: 0xfff0dc,
    },
    scandi: {
      label: 'Scandinavian', wall: 0xfbfaf6, ceiling: 0xffffff,
      floor: { kind: 'wood', wood: [36, 34, 70], rough: 0.55 },
      bedfloor: [36, 32, 68], wood: [36, 40, 63], dark: [33, 30, 50], flute: ['#b9976b', '#e6cfa6', '#d3b88a', '#a78458'],
      accent: { c: 0x2a2a2a, r: 0.5, m: 0.6 }, frame: 0xe7e5df, cab: 0xe9e6de, counter: 0xe7e1d6,
      fab: { Ivory: 0xf2eee5, Sand: 0xdad3c5, Terra: 0xc9a79a, Mustard: 0xdcc99a, Teal: 0x9db0a3, Grey: 0xb9b8b1 },
      rugs: [['#e7e0d2', '#8f9c8f', '#c9a79a'], ['#dcd6c8', '#6f7b70', '#dcc99a'], ['#e9e3d6', '#9db0a3', '#b7a58a'], ['#d8d2c4', '#f4f0e8', '#8f9c8f']],
      art: [['#f4f0e8', '#9db0a3', '#c9a79a', '#3a3a38'], ['#efe9dd', '#dcc99a', '#9db0a3', '#6f7b70'], ['#f6f2ea', '#c9a79a', '#3a3a38', '#b7a58a'], ['#e9e3d6', '#6f7b70', '#f6f2ea', '#dcc99a']],
      clad: 0xf1ede5, pot: 0xe6e0d4, glow: 0xffe9c8,
    },

      floor: { kind: 'stone', base: '#e9e2d5', vein: '140,122,98', rough: 0.22 },
      bedfloor: [30, 36, 50], wood: [26, 44, 36], dark: [24, 30, 20], flute: ['#5f4029', '#a47550', '#8b603f', '#4b301d'],
      accent: { c: 0xc9a25a, r: 0.28, m: 1.0 }, frame: 0x2f2a27, cab: 0x8c9a84, counter: 0xf1eee8,
      fab: { Ivory: 0xe7dfd0, Sand: 0xc9b79c, Terra: 0xb8674a, Mustard: 0xc99a3c, Teal: 0x3f6f73, Grey: 0x8c8a85 },
      rugs: [['#b46a4c', '#f0e4cf', '#e3b65c'], ['#c7a04a', '#f3ead8', '#7a4a33'], ['#6f8587', '#efe8da', '#d9c08a'], ['#8b8478', '#e9e1d2', '#c7a877']],
      art: [['#efe6d6', '#b8674a', '#c99a3c', '#3f6f73', '#2e2a28'], ['#e9dfd0', '#3f6f73', '#d6a48c', '#c99a3c'], ['#f1e9db', '#b8674a', '#8c9a84', '#2e2a28'], ['#d9c9b0', '#7a4a33', '#3f6f73', '#f3ead8']],
      clad: 0xffffff, pot: 0xb5694d, glow: 0xffd9a0,

  };

  const cache = {};
  function textures(name) {
    if (cache[name]) return cache[name];
    const T = THREE, K = A.texKit, st = A.STYLES[name], seed = { modern: 100, scandi: 200, luxury: 300 }[name];
    const woodTex = (w, plank, gap, vary, size, sd) => K.tex(size, (g, s, R) => K.wood(g, s, R, w[0], w[1], w[2], plank, gap, vary), seed + sd);
    const clampT = (t) => { t.wrapS = t.wrapT = T.ClampToEdgeWrapping; return t; };
    const o = {};
    o.floor = st.floor.kind === 'wood' ? woodTex(st.floor.wood, 128, 0.4, 7, 1024, 1) : K.tex(1024, (g, s, R) => K.marble(g, s, R, st.floor.base, st.floor.vein, 2, 1), seed + 1);
    o.bedfloor = woodTex(st.bedfloor, 128, 0.5, 9, 1024, 2);
    o.wood = woodTex(st.wood, 512, 0, 3, 512, 3);
    o.woodV = o.wood.clone(); o.woodV.rotation = Math.PI / 2; o.woodV.needsUpdate = true;
    o.dark = woodTex(st.dark, 512, 0, 3, 512, 4);
    o.flute = K.tex(512, (g, s, R) => {
      const n = 16, w = s / n;
      for (let i = 0; i < n; i++) {
        const gr = g.createLinearGradient(i * w, 0, (i + 1) * w, 0);
        gr.addColorStop(0, st.flute[0]); gr.addColorStop(0.25, st.flute[1]); gr.addColorStop(0.6, st.flute[2]); gr.addColorStop(1, st.flute[3]);
        g.fillStyle = gr; g.fillRect(i * w, 0, w + 1, s);
      }
    }, seed + 5);
    o.rugs = st.rugs.map((c, i) => clampT(K.tex(512, (g, s, R) => K.rug(g, s, R, c[0], c[1], c[2]), seed + 10 + i)));
    o.art = st.art.map((pal, i) => clampT(K.tex(512, (g, s, R) => K.art(g, s, R, pal), seed + 20 + i)));
    return (cache[name] = o);
  }

  A.setStyle = function (name) {
    if (!A.STYLES[name]) name = 'luxury';
    const st = A.STYLES[name], M = A.M, t = textures(name);
    const map = (m, tex) => { m.map = tex; m.needsUpdate = true; };
    A.style = name;
    M.wall.color.setHex(st.wall);
    M.ceiling.color.setHex(st.ceiling);
    map(M.marble, t.floor); M.marble.roughness = st.floor.rough; M.marble.color.setHex(0xffffff);
    map(M.stair, t.floor); M.stair.roughness = st.floor.rough + 0.08; M.stair.color.setHex(st.floor.kind === 'wood' ? 0xffffff : 0xf1e9dc);
    map(M.woodfloor, t.bedfloor);
    map(M.teak, t.wood); map(M.teakV, t.woodV); map(M.walnut, t.dark); map(M.fluted, t.flute);
    M.brass.color.setHex(st.accent.c); M.brass.roughness = st.accent.r; M.brass.metalness = st.accent.m;
    M.frame.color.setHex(st.frame); M.frame.metalness = name === 'scandi' ? 0.1 : 0.6;
    M.sage.color.setHex(st.cab);
    M.quartz.color.setHex(st.counter);
    for (const k in st.fab) M['fab' + k].color.setHex(st.fab[k]);
    [M.rugLiving, M.rugLounge, M.rugBed, M.rugGF].forEach((m, i) => map(m, t.rugs[i]));
    [M.art1, M.art2, M.art3, M.art4].forEach((m, i) => map(m, t.art[i]));
    M.cladding.color.setHex(st.clad);
    M.pot.color.setHex(st.pot);
    M.glow.emissive.setHex(st.glow); M.glowSoft.emissive.setHex(st.glow);
    document.querySelectorAll('[data-style]').forEach((b) => b.classList.toggle('on', b.dataset.style === name));
    if (A.onStyle) A.onStyle(name);
  };

  A.bindStyleButtons = function () {
    document.querySelectorAll('[data-style]').forEach((b) => b.addEventListener('click', () => A.setStyle(b.dataset.style)));
  };
})();

</script>
<script>
/* ---- js/shell.js ---- */
/* Builds the building shell from APP.plan: walls with openings, floors, ceilings,
   both stairs, railings, windows and doors, plus simple surroundings. */
(function () {
  const A = (window.APP = window.APP || {});
  const T = THREE;

  // --- small geometry kit -------------------------------------------------
  function worldUV(g, s) {
    const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) {
      const nx = Math.abs(n.getX(i)), ny = Math.abs(n.getY(i));
      let u, v;
      if (ny > 0.5) { u = p.getX(i); v = p.getZ(i); }
      else if (nx > 0.5) { u = p.getZ(i); v = p.getY(i); }
      else { u = p.getX(i); v = p.getY(i); }
      uv.setXY(i, u / s, v / s);
    }
  }
  function merge(geos) {
    let nV = 0, nI = 0;
    for (const g of geos) { nV += g.attributes.position.count; nI += g.index.count; }
    const pos = new Float32Array(nV * 3), nor = new Float32Array(nV * 3), uv = new Float32Array(nV * 2);
    const idx = new Uint32Array(nI);
    let vo = 0, io = 0;
    for (const g of geos) {
      pos.set(g.attributes.position.array, vo * 3);
      nor.set(g.attributes.normal.array, vo * 3);
      uv.set(g.attributes.uv.array, vo * 2);
      const gi = g.index.array;
      for (let k = 0; k < gi.length; k++) idx[io + k] = gi[k] + vo;
      vo += g.attributes.position.count;
      io += gi.length;
      g.dispose();
    }
    const out = new T.BufferGeometry();
    out.setAttribute('position', new T.BufferAttribute(pos, 3));
    out.setAttribute('normal', new T.BufferAttribute(nor, 3));
    out.setAttribute('uv', new T.BufferAttribute(uv, 2));
    out.setIndex(new T.BufferAttribute(idx, 1));
    out.computeBoundingSphere();
    out.computeBoundingBox();
    return out;
  }
  A.kit = { worldUV, merge };

  /* A batcher collects axis-aligned boxes per material and turns them into one
     mesh each, which keeps the draw-call count low. */
  function Batcher() {
    this.b = {};
  }
  Batcher.prototype.box = function (mk, x0, y0, x1, y1, z0, z1, grp) {
    if (x1 - x0 < 1e-4 || y1 - y0 < 1e-4 || z1 - z0 < 1e-4) return;
    const g = new T.BoxGeometry(x1 - x0, z1 - z0, y1 - y0);
    g.translate((x0 + x1) / 2, (z0 + z1) / 2, (y0 + y1) / 2);
    worldUV(g, A.S[mk] || 4);
    const key = (grp || 'main') + '|' + mk;
    (this.b[key] = this.b[key] || []).push(g);
  };
  Batcher.prototype.flush = function (groups) {
    for (const key in this.b) {
      const [grp, mk] = key.split('|');
      const m = new T.Mesh(merge(this.b[key]), A.M[mk]);
      const see = mk === 'glass' || mk === 'railglass';
      m.castShadow = !see && grp !== 'ctx'; // the houses around do not shade this one, so low sun still reaches it
      m.receiveShadow = !see;
      if (see) m.renderOrder = 5;
      m.name = key;
      groups[grp].add(m);
    }
    this.b = {};
  };
  A.Batcher = Batcher;

  A.buildShell = function (scene) {
    const P = A.plan, M = A.M, GR = P.ground;
    const { H, SLAB, GF, RISE, TREAD } = P;
    /* main = first floor, gmain = ground floor, both = pieces that run through
       both floors (stairs, the tall void wall), ceil = roof, ctx = surroundings. */
    const groups = { main: new T.Group(), gmain: new T.Group(), both: new T.Group(), ceil: new T.Group(), ctx: new T.Group() };
    groups.main.name = 'shell';
    groups.gmain.name = 'ground-shell';
    groups.both.name = 'stairs';
    groups.ceil.name = 'ceilings';
    groups.ctx.name = 'context';
    const B = new Batcher();
    const extra = []; // meshes that are not boxes (glass panels, rails)
    let G = 'main'; // the group new pieces go into
    const box = (mk, x0, y0, x1, y1, z0, z1, grp) => B.box(mk, x0, y0, x1, y1, z0, z1, grp || G);
    // wall-local box: u along the wall, v across its thickness
    const lb = (mk, ax, u0, u1, v0, v1, z0, z1) =>
      ax === 'x' ? box(mk, u0, v0, u1, v1, z0, z1) : box(mk, v0, u0, v1, u1, z0, z1);

    // --- door leaves (fl = floor level the door stands on) --------------------
    function leaf(ax, u0, u1, v0, v1, z0, z1, glazed, fl) {
      const alongU = u1 - u0 > v1 - v0;
      if (!glazed) {
        lb('teakV', ax, u0, u1, v0, v1, z0, z1);
        // handle
        if (alongU) lb('brass', ax, u1 - 0.42, u1 - 0.3, v0 - 0.12, v1 + 0.12, fl + 3.25, fl + 3.75);
        else lb('brass', ax, u0 - 0.12, u1 + 0.12, v1 - 0.42, v1 - 0.3, fl + 3.25, fl + 3.75);
        return;
      }
      const st = 0.3, bot = 0.6;
      if (alongU) {
        lb('teakV', ax, u0, u0 + st, v0, v1, z0, z1);
        lb('teakV', ax, u1 - st, u1, v0, v1, z0, z1);
        lb('teakV', ax, u0 + st, u1 - st, v0, v1, z0, z0 + bot);
        lb('teakV', ax, u0 + st, u1 - st, v0, v1, z1 - st, z1);
        const c = (v0 + v1) / 2;
        lb('glass', ax, u0 + st, u1 - st, c - 0.015, c + 0.015, z0 + bot, z1 - st);
        lb('brass', ax, u1 - 0.22, u1 - 0.1, v0 - 0.12, v1 + 0.12, fl + 3.2, fl + 3.9);
      } else {
        lb('teakV', ax, u0, u1, v0, v0 + st, z0, z1);
        lb('teakV', ax, u0, u1, v1 - st, v1, z0, z1);
        lb('teakV', ax, u0, u1, v0 + st, v1 - st, z0, z0 + bot);
        lb('teakV', ax, u0, u1, v0 + st, v1 - st, z1 - st, z1);
        const c = (u0 + u1) / 2;
        lb('glass', ax, c - 0.015, c + 0.015, v0 + st, v1 - st, z0 + bot, z1 - st);
      }
    }

    // --- openings ---------------------------------------------------------
    function opening(ax, t0, t1, o, fl) {
      const c = (t0 + t1) / 2, a = o.a, b = o.b, sill = fl + (o.sill || 0), head = fl + o.head;
      if (o.type === 'win' || o.type === 'vent') {
        const f = 0.13, d = 0.11;
        lb('frame', ax, a, b, c - d, c + d, sill, sill + f);
        lb('frame', ax, a, b, c - d, c + d, head - f, head);
        lb('frame', ax, a, a + f, c - d, c + d, sill + f, head - f);
        lb('frame', ax, b - f, b, c - d, c + d, sill + f, head - f);
        if (o.type === 'win') {
          const panes = Math.max(1, Math.round((b - a) / 2.3));
          for (let i = 1; i < panes; i++) {
            const u = a + ((b - a) * i) / panes;
            lb('frame', ax, u - 0.05, u + 0.05, c - d, c + d, sill + f, head - f);
          }
          lb('glass', ax, a + f, b - f, c - 0.015, c + 0.015, sill + f, head - f);
          lb('quartz', ax, a - 0.12, b + 0.12, t0 - 0.1, t1 + 0.1, sill - 0.09, sill);
        } else {
          lb('frost', ax, a + f, b - f, c - 0.02, c + 0.02, sill + f, head - f);
        }
        return;
      }
      // doors and cased openings: a teak lining (from the opening's own sill, for one high up a tall wall)
      fl = fl + (o.sill || 0);
      const j = 0.1;
      lb('teakV', ax, a, a + j, t0 - 0.03, t1 + 0.03, fl, head);
      lb('teakV', ax, b - j, b, t0 - 0.03, t1 + 0.03, fl, head);
      lb('teakV', ax, a + j, b - j, t0 - 0.03, t1 + 0.03, head - j, head);
      if (o.type === 'open') return;
      const glazed = o.type === 'gdoor', th = 0.07, z0 = fl + 0.03, z1 = head - j;
      if (o.leaves === 2) { // double door: one leaf hinged at each side
        const m = (a + b) / 2, w2 = (b - a - 2 * j) / 2;
        if (!o.isOpen) {
          leaf(ax, a + j, m - 0.01, c - th, c + th, z0, z1, glazed, fl);
          leaf(ax, m + 0.01, b - j, c - th, c + th, z0, z1, glazed, fl);
        } else {
          for (const h of [a + j + th, b - j - th]) {
            if (o.swing > 0) leaf(ax, h - th, h + th, t1, t1 + w2, z0, z1, glazed, fl);
            else leaf(ax, h - th, h + th, t0 - w2, t0, z0, z1, glazed, fl);
          }
        }
        return;
      }
      const w = b - a - 2 * j;
      if (!o.isOpen) {
        leaf(ax, a + j, b - j, c - th, c + th, z0, z1, glazed, fl);
      } else {
        const h = o.hinge === 'a' ? a + j + th : b - j - th;
        if (o.swing > 0) leaf(ax, h - th, h + th, t1, t1 + w, z0, z1, glazed, fl);
        else leaf(ax, h - th, h + th, t0 - w, t0, z0, z1, glazed, fl);
      }
    }

    // --- walls ------------------------------------------------------------
    function buildWalls(list) {
      for (const w of list) {
        const [x0, y0, x1, y1] = w.r, fl = w.base || 0;
        let z0 = w.z ? w.z[0] : 0;
        const z1 = w.z ? w.z[1] : H, mk = w.mat || 'wall', ax = w.ax;
        if (z0 === fl) z0 = fl - 0.02;
        const lo = ax === 'x' ? x0 : y0, hi = ax === 'x' ? x1 : y1;
        const t0 = ax === 'x' ? y0 : x0, t1 = ax === 'x' ? y1 : x1;
        const ops = (w.ops || []).slice().sort((p, q) => p.a - q.a);
        // cut the wall at every opening edge; in each stretch build only the solid heights,
        // so openings can sit one above the other (a door on each floor of a tall wall)
        const cuts = Array.from(new Set([lo, hi].concat(ops.flatMap((o) => [o.a, o.b])).filter((v) => v >= lo && v <= hi))).sort((p, q) => p - q);
        for (let i = 0; i < cuts.length - 1; i++) {
          const a = cuts[i], b = cuts[i + 1], mid = (a + b) / 2;
          const holes = ops.filter((o) => o.a < mid && o.b > mid).map((o) => [fl + (o.sill || 0), fl + o.head]).sort((p, q) => p[0] - q[0]);
          let cur = z0;
          for (const [h0, h1] of holes) { if (h0 - cur > 0.03) lb(mk, ax, a, b, t0, t1, cur, h0); cur = Math.max(cur, h1); }
          if (z1 - cur > 1e-3) lb(mk, ax, a, b, t0, t1, cur, z1);
        }
        for (const o of ops) opening(ax, t0, t1, o, fl);
      }
    }
    buildWalls(P.walls);
    for (const p of P.pillars) box(p.mat, p.r[0], p.r[1], p.r[2], p.r[3], p.z[0] === 0 ? -0.02 : p.z[0], p.z[1]);

    // --- slabs, floors, ceilings -------------------------------------------
    for (const s of P.slabs) box('marble', s[0], s[1], s[2], s[3], -SLAB, -0.02);
    for (const f of P.floors) box(f[4], f[0], f[1], f[2], f[3], -0.02, 0);
    for (const c of P.ceilings) box('ceiling', c[0], c[1], c[2], c[3], H, H + SLAB, 'ceil');

    // --- main stair (round the void, joins the two floors) -------------------
    const TH = 0.56; // step thickness: reads as a folded-plate stair
    G = 'both';
    for (let i = 0; i < 7; i++) { // flight 1, heading south
      const top = -(i + 1) * RISE;
      box('stair', 20.29 + i * TREAD, 24.375, 20.29 + (i + 1) * TREAD + 0.02, 27.875, top - TH, top);
    }
    box('stair', 26.125, 23.96, 29.625, 27.875, -8 * RISE - TH, -8 * RISE);
    for (let j = 0; j < 7; j++) { // flight 2, heading east
      const top = -(9 + j) * RISE;
      box('stair', 26.125, 23.96 - (j + 1) * TREAD - 0.02, 29.625, 23.96 - j * TREAD, top - TH, top);
    }
    box('stair', 26.125, 14.625, 29.625, 18.125, -16 * RISE - TH, -16 * RISE);
    for (let k = 0; k < 3; k++) { // flight 3, heading north
      const top = -(17 + k) * RISE;
      box('stair', 26.125 - (k + 1) * TREAD - 0.02, 14.625, 26.125 - k * TREAD, 18.125, top - TH, top);
    }
    // --- feature finishes ---------------------------------------------------
    box('cladding', 29.56, 14.625, 29.625, 27.875, GF, H);            // tall south wall of the void
    G = 'main';

    if (!GR) {
      // --- placeholder ground floor (no ground floor drawing) -----------------
      box('marble', 9, 14.25, 29.625, 28.25, GF - 0.3, GF);
      box('wall', -1, 0, 29.625, 14.25, GF, -SLAB);           // solid mass under the rear block
      box('wall', -0.375, 14.625, 9, 28.625, GF, -SLAB);      // under the lounge
      box('wall', 8.875, 28.25, 29.625, 47, GF, -SLAB);       // under the master suite
    } else {
      // --- ground floor, from its own plan -----------------------------------
      G = 'gmain';
      const PL = GF + GR.PORCH;
      buildWalls(GR.walls);
      for (const p of GR.pillars) box(p.mat, p.r[0], p.r[1], p.r[2], p.r[3], p.z[0] === GF ? GF - 0.02 : p.z[0], p.z[1]);
      for (const r of GR.indoor) { box('stone', r[0], r[1], r[2], r[3], PL - 0.6, GF - 0.035); box('marble', r[0], r[1], r[2], r[3], GF - 0.035, GF - 0.02); }
      for (const r of GR.plinth) box('stone', r[0], r[1], r[2], r[3], PL - 0.6, GF - 0.02);
      box('stonefloor', 19, 47, 29.625, 52.75, GF - 0.02, GF);                  // floor of the front stair
      for (const f of GR.floors) box(f[4], f[0], f[1], f[2], f[3], f[5] - 0.02, f[5]);
      for (const a of GR.areaList) if (a.kind === 'porch') box('stone', a.r[0], a.r[1], a.r[2], a.r[3], PL - 0.6, PL - 0.02);
      for (const s of GR.steps) box('stone', s[0], s[1], s[2], s[3], PL - 0.3, GF + s[4]);
      // ceiling finish under the first floor slabs
      for (const s of P.slabs) box('ceiling', s[0], s[1], s[2], s[3], -SLAB - 0.03, -SLAB);

      // front stair, as drawn on the ground floor: up, round a winder landing, and back
      G = 'both';
      const N = 16, RF = (0 - GF) / N, TF = 9.5 / 12, X0 = 22.13, X1 = X0 + 6 * TF;
      const fbA = P.areaById['front-balcony'];
      const yU = fbA && fbA.r[3] > 50 && fbA.r[3] < 52.3 && fbA.r[2] > X0 ? fbA.r[3] + 0.02 : 50.01; // upper flight clears the balcony slab
      for (let k = 1; k <= 6; k++) box('stair', X0 + (k - 1) * TF, 47, X0 + k * TF + 0.02, 49.76, GF + k * RF - TH, GF + k * RF);
      const wy = [47, 48.9, 50.85, 52.75];
      for (let k = 0; k < 3; k++) box('stair', X1, wy[k], 29.625, wy[k + 1] + (k < 2 ? 0.02 : 0), GF + (7 + k) * RF - TH, GF + (7 + k) * RF);
      for (let k = 1; k <= 6; k++) box('stair', X1 - k * TF - 0.02, yU, X1 - (k - 1) * TF, 52.75, GF + (9 + k) * RF - TH, GF + (9 + k) * RF);
      // second run, from the landing beside the balcony up to the roof
      const TOPL = H + SLAB, RT = TOPL / N;
      for (let k = 1; k <= 6; k++) box('stair', X0 + (k - 1) * TF, 47, X0 + k * TF + 0.02, 49.76, k * RT - TH, k * RT);
      for (let k = 0; k < 3; k++) box('stair', X1, wy[k], 29.625, wy[k + 1] + (k < 2 ? 0.02 : 0), (7 + k) * RT - TH, (7 + k) * RT);
      for (let k = 1; k <= 6; k++) box('stair', X1 - k * TF - 0.02, 50.01, X1 - (k - 1) * TF, 52.75, (9 + k) * RT - TH, (9 + k) * RT);
      box('stone', 19.375, 47, X0, 52.75, TOPL - SLAB, TOPL - 0.02);           // landing on the roof
      box('stonefloor', 19.375, 47, X0, 52.75, TOPL - 0.02, TOPL);
      box('wall', X0, 49.76, X1, 50.01, GF, TOPL);                              // wall between the flights, full height
      G = 'main';
      // railings on the open sides of the upper run and its landings
      const R0 = 0.07;
      const tall = (id) => GR.walls.some((w) => w.id === id && w.z[1] > TOPL - 0.5);
      if (!tall('g-stair-south')) glassRun([29.52, 47.05, 6 * RT], [29.52, 52.68, 9 * RT], 0, 'both');   // winders, south side
      if (!tall('g-stair-front')) {
        glassRun([29.52, 52.66, 9 * RT], [X1, 52.66, 9 * RT], 0, 'both');         // winders, road side
        glassRun([X1, 52.66, 9 * RT], [X0, 52.66, 15 * RT], 0, 'both');          // top flight, road side
        glassRun([X0, 52.66, 0], [19.45, 52.66, 0], 0, 'both');                  // first floor landing, road side
      }
      if (!tall('g-stair-north')) glassRun([19.45, 52.66, 0], [19.45, 50.6, 0], 0, 'both'); // landing, north side
      glassRun([X0, 52.66, TOPL], [19.45, 52.66, TOPL], 0, 'both');            // roof landing, road side
      glassRun([19.45, 52.66, TOPL], [19.45, 47.05, TOPL], 0, 'both');         //   north side
      glassRun([X0 + R0, 47.05, TOPL], [X0 + R0, 49.76, TOPL], 0, 'both');     //   over the flight below
      // roof finish: terrace tiles on top of the roof slab
      for (const c of P.ceilings.slice(0, 4)) box('stonefloor', c[0], c[1], c[2], c[3], TOPL, TOPL + 0.02, 'ceil');
      // parapet round the roof (part of the roof, so the dollhouse view lifts it off too)
      for (const s of (A.frontStair || {}).parapet || []) {
        const t = 0.375, a = s.c - (s.n > 0 ? t : 0), b = s.c + (s.n < 0 ? t : 0);
        if (s.dir === 'y') { box('wall', a, s.a, b, s.b, TOPL, TOPL + 3, 'ceil'); box('stone', a - 0.05, s.a, b + 0.05, s.b, TOPL + 3, TOPL + 3.15, 'ceil'); }
        else { box('wall', s.a, a, s.b, b, TOPL, TOPL + 3, 'ceil'); box('stone', s.a, a - 0.05, s.b, b + 0.05, TOPL + 3, TOPL + 3.15, 'ceil'); }
      }
    }

    // --- pergola over the cut-out beside the terrace ------------------------
    // Pergola over the road end of the terrace (it used to cover an open gap there).
    const ter = P.areaById.terrace;
    if (ter && ter.r[3] - ter.r[1] > 12 && ter.r[2] - ter.r[0] > 5) {
      const pg = H - 0.45, pt = H + SLAB, x0 = ter.r[0] + 0.5, x1 = ter.r[2] - 0.35, y1 = ter.r[3] - 0.2, y0 = y1 - 7.8;
      box('teak', x0, y0, x1, y0 + 0.4, pg, pt);
      box('teak', x0, y1 - 0.4, x1, y1, pg, pt);
      box('teak', x0, y0, x0 + 0.4, y1, pg, pt);
      box('teak', x1 - 0.4, y0, x1, y1, pg, pt);
      const nb = Math.max(2, Math.round((y1 - y0) / 2.6));
      for (let k = 1; k < nb; k++) { const y = y0 + ((y1 - y0) * k) / nb; box('teak', x0, y - 0.18, x1, y + 0.18, pg, pt); }
      for (let x = x0 + 0.5; x < x1 - 0.3; x += 0.62) box('teak', x, y0, x + 0.16, y1, pt, pt + 0.35);
      for (const [px, py] of [[x0 + 0.07, y0 + 0.07], [x1 - 0.33, y0 + 0.07], [x0 + 0.07, y1 - 0.33], [x1 - 0.33, y1 - 0.33]]) box('metal', px, py, px + 0.26, py + 0.26, 0, pg);
    }

    // --- interior glass railings --------------------------------------------
    function glassRun(p, q, h, grp) { // p, q = [x, y, height]; follows the slope
      h = h || 3.25;
      const keep = (m) => { m.userData.grp = grp || 'main'; extra.push(m); };
      P.solids.push([Math.min(p[0], q[0]) - 0.06, Math.min(p[1], q[1]) - 0.06, Math.max(p[0], q[0]) + 0.06, Math.max(p[1], q[1]) + 0.06, Math.min(p[2], q[2]) - 0.5, Math.max(p[2], q[2]) + h]);
      const g = new T.BufferGeometry();
      const v = [p[0], p[2] + 0.12, p[1], q[0], q[2] + 0.12, q[1], q[0], q[2] + h, q[1], p[0], p[2] + h, p[1]];
      g.setAttribute('position', new T.Float32BufferAttribute(v, 3));
      g.setAttribute('uv', new T.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
      g.setIndex([0, 1, 2, 0, 2, 3]);
      g.computeVertexNormals();
      const m = new T.Mesh(g, M.railglass);
      m.renderOrder = 6;
      keep(m);
      // handrail
      const a = new T.Vector3(p[0], p[2] + h, p[1]), b = new T.Vector3(q[0], q[2] + h, q[1]);
      const len = a.distanceTo(b);
      const rail = new T.Mesh(new T.BoxGeometry(0.15, 0.1, len + 0.08), M.teak);
      rail.position.copy(a).add(b).multiplyScalar(0.5);
      rail.lookAt(b);
      rail.castShadow = true;
      keep(rail);
      // base shoe
      const a0 = new T.Vector3(p[0], p[2] + 0.07, p[1]), b0 = new T.Vector3(q[0], q[2] + 0.07, q[1]);
      const shoe = new T.Mesh(new T.BoxGeometry(0.12, 0.2, len), M.steel);
      shoe.position.copy(a0).add(b0).multiplyScalar(0.5);
      shoe.lookAt(b0);
      keep(shoe);
    }
    const e = 0.1;
    for (const s of P.rails.glass) { // floor edges beside the void and the stairwell
      const c = s.c - e * s.n;
      if (s.dir === 'y') {
        glassRun([c, s.a - e, 0], [c, s.b + e, 0]);
        box('fluted', Math.min(s.c, s.c + 0.045 * s.n), s.a, Math.max(s.c, s.c + 0.045 * s.n), s.b, -SLAB - 0.35, 0);
      } else {
        glassRun([s.a - e, c, 0], [s.b + e, c, 0]);
        box('fluted', s.a, Math.min(s.c, s.c + 0.045 * s.n), s.b, Math.max(s.c, s.c + 0.045 * s.n), -SLAB - 0.35, 0);
      }
    }
    glassRun([20.29, 24.375 + e, 0], [26.125 + e, 24.375 + e, -8 * RISE], 0, 'both');      // flight 1
    glassRun([26.125 + e, 24.375 + e, -8 * RISE], [26.125 + e, 23.96, -8 * RISE], 0, 'both');
    glassRun([26.125 + e, 23.96, -8 * RISE], [26.125 + e, 18.125 + e, -16 * RISE], 0, 'both'); // flight 2
    glassRun([26.125 + e, 18.125 - e, -16 * RISE], [23.62, 18.125 - e, GF], 0, 'both');    // flight 3

    // --- outdoor jaali railings ---------------------------------------------
    function jaaliRun(xa, ya, xb, yb, h) {
      h = h || 3.5;
      P.solids.push([Math.min(xa, xb) - 0.07, Math.min(ya, yb) - 0.07, Math.max(xa, xb) + 0.07, Math.max(ya, yb) + 0.07, 0, h]);
      const alongX = Math.abs(xb - xa) > Math.abs(yb - ya);
      const len = alongX ? Math.abs(xb - xa) : Math.abs(yb - ya);
      const t = 0.07;
      if (alongX) {
        const x0 = Math.min(xa, xb), x1 = Math.max(xa, xb);
        box('metal', x0, ya - t, x1, ya + t, h - 0.14, h);
        box('metal', x0, ya - t, x1, ya + t, 0.18, 0.3);
        const n = Math.max(1, Math.round(len / 4.5));
        for (let i = 0; i <= n; i++) { const x = x0 + ((x1 - x0) * i) / n; box('metal', x - 0.08, ya - 0.08, x + 0.08, ya + 0.08, 0, h); }
      } else {
        const y0 = Math.min(ya, yb), y1 = Math.max(ya, yb);
        box('metal', xa - t, y0, xa + t, y1, h - 0.14, h);
        box('metal', xa - t, y0, xa + t, y1, 0.18, 0.3);
        const n = Math.max(1, Math.round(len / 4.5));
        for (let i = 0; i <= n; i++) { const y = y0 + ((y1 - y0) * i) / n; box('metal', xa - 0.08, y - 0.08, xa + 0.08, y + 0.08, 0, h); }
      }
      const ph = h - 0.44;
      const g = new T.PlaneGeometry(len, ph);
      const uv = g.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) * len) / 2.9, uv.getY(i));
      const m = new T.Mesh(g, M.jaali);
      if (!alongX) m.rotation.y = Math.PI / 2;
      m.position.set((xa + xb) / 2, 0.3 + ph / 2, (ya + yb) / 2);
      m.castShadow = true;
      m.receiveShadow = true;
      m.userData.grp = 'main';
      extra.push(m);
    }
    for (const s of P.rails.jaali) { // open edges of the terrace and balconies
      if (s.b - s.a < 0.3) continue;
      if (s.dir === 'y') jaaliRun(s.c, s.a, s.c, s.b); else jaaliRun(s.a, s.c, s.b, s.c);
    }

    // --- surroundings ---------------------------------------------------------
    // E = the level everything outside stands on (a little above the outside ground)
    const E = GR ? GF + GR.PORCH + 0.2 : GF;
    const cb = (mk, x0, y0, x1, y1, z0, z1) => box(mk, x0, y0, x1, y1, z0, z1, 'ctx');
    cb('ground', -140, -120, 170, 54.5, E - 2, E - 0.3);
    cb('road', -140, 54.5, 170, 78, E - 2, E - 0.45);
    cb('ground', -140, 78, 170, 200, E - 2, E - 0.3);
    if (!GR) {
      // compound wall and gate piers, as drawn at the front of the plot
      cb('stone', 15.88, 54.1, 30.375, 54.5, GF - 0.3, GF + 5);
      cb('stone', 0, 52.8, 0.46, 54.5, GF - 0.3, GF + 6);
      cb('stone', 13.64, 53.65, 15.88, 54.5, GF - 0.3, GF + 6);
      cb('stone', 0, 47, 0.375, 52.8, GF - 0.3, GF + 5);
      cb('stone', 0, 39, 0.375, 46.25, GF - 0.3, GF + 5);
      cb('stone', 29.625, 50.54, 30.375, 54.5, GF - 0.3, GF + 5);
      for (let x = 0.9; x < 13.5; x += 0.55) cb('metal', x, 54.2, x + 0.1, 54.32, GF, GF + 5);

      // two gate leaves, standing open into the porch
      const gp = GR.pillars.find((p) => p.id === 'gp-gate'), gx0 = gp ? gp.r[2] : 0.75, gx1 = 12, half = (gx1 - gx0) / 2;

    const nb = (mk, x0, y0, x1, y1, h) => cb(mk, x0, y0, x1, y1, E - 0.3, E + h);

          cb('nb1', x - 0.3, fy - 0.5, x + 4.3, fy + 0.2, E + fl * 10.5 + 8, E + fl * 10.5 + 8.4);

    const trunkG = new T.CylinderGeometry(0.5, 0.7, 9, 8);

    for (const [x, y, s] of [[-14, 81, 1], [16, 81.5, 1.2], [44, 81, 0.9], [72, 82, 1.1], [-46, 81, 1], [-12, 58, 0.8], [40, 58.5, 0.9], [-17, 21, 1.0], [-16, -13, 0.9], [9, -21, 1.1], [27, -23, 0.95], [-19, 41, 0.85], [-30, 6, 1.1], [44, -30, 1.0]]) {
      const tr = new T.Mesh(trunkG, M.trunk);
      tr.position.set(x, E + 4.5 * s, y);

      groups.ctx.add(tr);

        cr.scale.setScalar(r * s);
        cr.castShadow = true;
        groups.ctx.add(cr);
      }
    }

    scene.add(groups.main, groups.gmain, groups.both, groups.ceil, groups.ctx);
    A.groups = groups;
    return groups;
  };

<script>
/* ---- js/models.js ---- */
/* Loads the furniture models made in Blender (models-data.js) and hands out ready meshes.
   Each model is split into parts by role; the caller says which material each role gets,
   so one model serves every style. Geometry is decoded once and shared by every copy. */
(function () {
  const A = (window.APP = window.APP || {});
  const T = THREE;
  const geos = {};

  function bytes(b64) {
    const s = atob(b64), u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u.buffer;
  }
  function decode(part) {
    const q = new Uint16Array(bytes(part.p)), qn = new Int8Array(bytes(part.n));
    const n = q.length / 3, pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);
    const lo = part.lo, sp = [part.hi[0] - lo[0], part.hi[1] - lo[1], part.hi[2] - lo[2]];
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < 3; k++) { pos[i * 3 + k] = lo[k] + (q[i * 3 + k] / 65535) * sp[k]; nor[i * 3 + k] = qn[i * 3 + k] / 127; }
      // box-projected texture coordinates (feet), so fabric weave and grain sit at a true scale
      const ax = Math.abs(nor[i * 3]), ay = Math.abs(nor[i * 3 + 1]), x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
      if (ay >= ax && ay >= Math.abs(nor[i * 3 + 2])) { uv[i * 2] = x; uv[i * 2 + 1] = z; }
      else if (ax >= Math.abs(nor[i * 3 + 2])) { uv[i * 2] = z; uv[i * 2 + 1] = y; }
      else { uv[i * 2] = x; uv[i * 2 + 1] = y; }
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.BufferAttribute(pos, 3));
    g.setAttribute('normal', new T.BufferAttribute(nor, 3));
    g.setAttribute('uv', new T.BufferAttribute(uv, 2));
    g.setIndex(new T.BufferAttribute(part.big ? new Uint32Array(bytes(part.i)) : new Uint16Array(bytes(part.i)), 1));
    g.computeBoundingSphere();
    return g;
  }

  A.hasModel = (name) => !!(window.FURNITURE_MODELS && window.FURNITURE_MODELS[name]);
  A.modelSize = (name) => (A.hasModel(name) ? window.FURNITURE_MODELS[name].size : null);

  /* A group with one mesh per part. mats: { role: material }; a role left out is skipped.
     The model stands on y = 0, centred on x and z (bedding: head at z = 0, mattress top at y = 0). */
  A.model = function (name, mats, opts) {
    const m = window.FURNITURE_MODELS[name], g = new T.Group();
    opts = opts || {};
    for (let i = 0; i < m.parts.length; i++) {
      const part = m.parts[i], mat = mats[part.r];
      if (!mat) continue;
      const key = name + '#' + i;
      const geo = geos[key] || (geos[key] = decode(part));
      const mesh = new T.Mesh(geo, mat);
      mesh.castShadow = opts.shadow !== false && part.r !== 'bulb' && part.r !== 'pipe';
      mesh.receiveShadow = true;
      g.add(mesh);
    }
    return g;
  };
})();

<script>
/* ---- js/furniture.js ---- */
/* Furniture and fittings, built from simple shapes and sized to each room.
   Loose pieces are made facing "front" (+z) and then turned and placed.
   Built-ins (kitchen, wardrobes, panels) are drawn straight in plan coordinates. */
(function () {
  const A = (window.APP = window.APP || {});
  const T = THREE;

  A.buildFurniture = function (scene) {
    const P = A.plan, M = A.M, H = P.H, GF = P.GF;
    // one holder for everything, with a group per floor so a floor can be hidden on its own
    const all = new T.Group(), ff = new T.Group(), gf = new T.Group();
    all.name = 'furniture';
    ff.name = 'furniture-first';
    gf.name = 'furniture-ground';
    all.add(ff, gf);
    A.groups.furnAll = all;
    A.groups.furn = ff;
    A.groups.gfurn = gf;
    let root = ff, FG = 'furn'; // where new pieces go: switched to the ground floor further down
    A.blockers = [];
    const B = new A.Batcher();
    const pb = (mk, x0, y0, x1, y1, z0, z1) => B.box(mk, x0, y0, x1, y1, z0, z1, FG);
    const block = (x0, y0, x1, y1, lvl) => A.blockers.push([x0 - 0.35, y0 - 0.35, x1 + 0.35, y1 + 0.35, lvl || 0]);

    // --- kit -----------------------------------------------------------------
    const cache = {};
    cache.ico = new T.IcosahedronGeometry(1, 1);
    function fix(geo, mat) { if (mat.userData && mat.userData.s) A.kit.worldUV(geo, mat.userData.s); return geo; }
    function mesh(geo, mat, x, y, z) {
      const m = new T.Mesh(geo, mat);
      m.castShadow = m.receiveShadow = true;
      m.position.set(x || 0, y || 0, z || 0);
      return m;
    }
    function bx(w, h, d, mat, x, y, z) { // y = height of the underside
      return mesh(fix(new T.BoxGeometry(w, h, d), mat), mat, x, (y || 0) + h / 2, z);
    }
    function rgeo(w, h, d, r) {
      const key = [w, h, d, r].map((v) => v.toFixed(3)).join('_');
      if (cache[key]) return cache[key];
      r = Math.min(r, w / 2 - 0.01, d / 2 - 0.01, h / 2 - 0.005);

        'float hash(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }',

    const lamps = [
      [5, 6, 8.3, 46, 24],         // 0 living seating
      [14.3, 7.9, 6.1, 34, 20],    // 1 dining pendant
      [23.2, 5.6, 8.8, 32, 17],    // 2 kitchen

      gl(12.6, 32.4, HG - 2.3, 30, 16);    // +2 kitchen
      gl(6.4, 9.6, HG - 2.6, 38, 20);      // +3 children's bedroom
      gl(2.3, 2.6, HG - 3.4, 16, 9);       // +4 pooja
      gl(16.4, 11.4, HG - 2.3, 18, 11);    // +5 common toilet
      gl(24.2, 6.6, HG - 2.6, 36, 20);     // +6 guest bedroom
      gl(23.4, 30.8, HG - 2.3, 20, 12);    // +7 toilet
      gl(22.6, 39, HG - 2.6, 38, 22);      // +8 master bedroom
      gl(4.2, 31, HG - 2.4, 22, 15);       // +9 entry lobby

    f(20.2, 9, 26, 13.6, 2, 2);        // common washroom

    f(10.4, 25.2, 26, 27.2, 4, 1);     // gallery and stair
    f(10.2, 29.4, 21.4, 45.2, 3, 4);   // bedroom
    f(23.4, 39, 28.4, 43.6, 2, 2);     // dress

      g(13.6, 25, 20, 27.4, 3, 1);       // hall, under the gallery
      g(0.5, 5.6, 12, 13.6, 3, 2);       // children's bedroom
      spot(2.2, 2.7, top, 'gmain');      // pooja
      spot(9, 2.4, top, 'gmain');        // court
      spot(16.2, 2.6, top, 'gmain');     // store
      g(14, 10.4, 18.6, 13.4, 2, 1);     // common toilet
      spot(17.4, 8.1, top, 'gmain');
      g(20.6, 1.8, 28.8, 11.4, 3, 3);    // guest bedroom
      g(10.8, 29.4, 15.2, 35.4, 2, 3);   // kitchen
      spot(18, 29.6, top, 'gmain'); spot(18, 32, top, 'gmain'); // passage
      g(21, 29.2, 26.4, 32.4, 3, 1);     // toilet
      g(17.4, 34.8, 28.4, 43.4, 3, 3);   // master bedroom
      g(1.5, 29.6, 6.8, 32.4, 2, 1);     // entry lobby

      sun.position.copy(target).addScaledVector(sunDir, 130);

      sun.intensity = o.i;
      U.zen.value.set(o.zen[0], o.zen[1], o.zen[2]);
      U.hor.value.set(o.hor[0], o.hor[1], o.hor[2]);

      U.sunCol.value.set(o.c[0], o.c[1], o.c[2]);

      envMat.uniforms.gain.value = o.env;
      envMat.uniforms.amb.value.set(0.10 * night, 0.075 * night, 0.05 * night); // after dark, metal mirrors the lit rooms

      hemi.groundColor.setRGB(lerp(0.796, 0.95, night), lerp(0.71, 0.74, night), lerp(0.588, 0.5, night));

      M.glowSoft.emissiveIntensity = 0.9 * o.glow;
      M.frost.emissiveIntensity = 0.5 * day;
      M.nbwin.emissiveIntensity = 1.5 * night;
      for (const k in base) M[k].envMapIntensity = base[k] * (k === 'glass' || k === 'railglass' ? 1 + 0.5 * night : 1);
      M.glass.opacity = 0.16 + 0.1 * night;

    }
    A.tod = 0.55;
    A.setTod = function (t, instant) {
      goal = Math.min(1, Math.max(0, +t || 0));
      if (instant) { cur = goal; A.tod = cur; apply(cur); refreshEnv(); envAt = cur; settle = 0; }
    };
    /* Called every frame. Moves smoothly toward the chosen time; the sky mirrored
       by shiny surfaces is redrawn a few times a second while it changes. */
    A.todStep = function (dt) {
      if (Math.abs(goal - cur) > 0.0005) {
        cur += (goal - cur) * (1 - Math.exp(-5 * dt));
        if (Math.abs(goal - cur) <= 0.0005) cur = goal;
        A.tod = cur;
        apply(cur);
        envT += dt;
        if (envT > 0.3 && Math.abs(cur - envAt) > 0.012) { refreshEnv(); envAt = cur; envT = 0; }
        settle = 0.35;
        return true;
      }
      if (settle > 0) {
        settle -= dt;
        if (settle <= 0) { if (envAt !== cur) { refreshEnv(); envAt = cur; } if (A.onTodSettled) A.onTodSettled(); }
      }
      return false;
    };
    A.setTod(0.55, true);
    A.updateLights(new T.Vector3(17, 5, 26), false);
  };
})();
