<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>First Floor Walkthrough</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #f4efe6; --dim: #c9c0b1; --panel: rgba(24, 20, 17, 0.62); --line: rgba(244, 239, 230, 0.16);
    --brass: #d2a85c; --brass-ink: #1d1712;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14110f; color: var(--ink);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  #caption { position: fixed; left: 16px; top: 16px; padding: 10px 14px 11px; min-width: 150px; pointer-events: none;
    transition: opacity .35s; }
  #caption .name { font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  #caption .size { color: var(--dim); font-size: 13px; margin-top: 1px; font-variant-numeric: tabular-nums; }
  #caption .tag { color: var(--brass); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
  #mapwrap { position: fixed; right: 16px; top: 16px; padding: 8px; }
  #map { display: block; width: 132px; height: 216px; }
  #bar { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 9px; }
  #row1 { display: flex; align-items: center; gap: 10px; }
  #row0 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #row0 .lbl { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-right: 2px; }
  #row0 .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  #row0 .seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 12px; }
  #row0 .seg button + button { border-left: 1px solid var(--line); }
  #row0 button.on { background: var(--ink); color: var(--brass-ink); }
  #row0 .gap { flex: 1; }
  button { font: inherit; color: var(--ink); background: rgba(244, 239, 230, 0.08); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(244, 239, 230, 0.16); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  #play { background: var(--brass); color: var(--brass-ink); border-color: transparent; font-weight: 600; min-width: 118px; }
  #play:hover { background: #dfb76c; }
  #track { flex: 1; height: 6px; border-radius: 3px; background: rgba(244, 239, 230, 0.16); position: relative; cursor: pointer; min-width: 40px; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: var(--brass); }
  #time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
  #stops { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #stops::-webkit-scrollbar { display: none; }
  #stops button { padding: 5px 10px; font-size: 12.5px; color: var(--dim); }
  #stops button.on { color: var(--brass-ink); background: var(--ink); }
  #hint { position: fixed; left: 50%; bottom: 168px; transform: translateX(-50%); padding: 7px 12px; font-size: 12.5px;
    color: var(--dim); pointer-events: none; transition: opacity .6s; text-align: center; max-width: calc(100% - 24px); width: max-content; }
  @media (pointer: coarse) { #hint .kb { display: none; } }
  #fade { position: fixed; inset: 0; background: #0d0b0a; opacity: 0; pointer-events: none; transition: opacity .55s; }
  #loading { position: fixed; inset: 0; background: #14110f; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; transition: opacity .6s; }
  #loading .t { font-size: 20px; font-weight: 600; }
  #loading .s { color: var(--dim); }
  #end { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 18px 20px; text-align: center;
    display: none; }
  #end .t { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  #end .s { color: var(--dim); margin-bottom: 12px; }
  #end button { margin: 0 3px; }
  #editlink { color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; white-space: nowrap; background: rgba(244, 239, 230, 0.08); }
  #editlink:hover { background: rgba(244, 239, 230, 0.16); }
  #notice { position: fixed; left: 16px; top: 92px; max-width: 300px; padding: 8px 12px; font-size: 12.5px; color: var(--dim); display: none; }
  #notice a { color: var(--brass); }
  .hide { opacity: 0 !important; }
  @media (max-width: 640px) {
    #caption { left: 10px; top: 10px; } #mapwrap { right: 10px; top: 10px; padding: 6px; }
    #map { width: 92px; height: 151px; } #bar { left: 10px; right: 10px; bottom: 10px; }
    #time, #editlink { display: none; } #hint { bottom: 196px; font-size: 11.5px; } #play { min-width: 104px; }
  }
  body.debug .panel, body.debug #hint { display: none !important; }
</style>
</head>

<canvas id="view"></canvas>

<div id="caption" class="panel"><div class="tag">First floor</div><div class="name">&nbsp;</div><div class="size">&nbsp;</div></div>
<div id="mapwrap" class="panel"><canvas id="map" width="264" height="432"></canvas></div>
<div id="hint" class="panel">Drag to look, or press Mouse look <span class="kb">&nbsp;·&nbsp; W A S D to walk</span> &nbsp;·&nbsp; tap the floor to move</div>

  <div id="row0">
    <span class="lbl">Style</span>
    <div class="seg"><button type="button" data-style="modern">Modern</button><button type="button" data-style="scandi">Scandinavian</button><button type="button" data-style="luxury">Warm luxury</button></div>
    <span class="gap"></span>
    <button id="mlook" type="button" title="Capture the mouse to look around; Esc releases it">Mouse look</button>
    <button id="doll" type="button" title="See the whole floor from above with the roof off">Dollhouse view</button>
  </div>
  <div id="row1">
    <button id="play" type="button">▶ Play tour</button>
    <button id="restart" type="button" title="Start again">Restart</button>
    <div id="track"><div id="fill"></div></div>
    <div id="time">0:00 / 0:00</div>
  </div>
  <div id="stops"></div>
</div>

<div id="end" class="panel">
  <div class="t">Tour complete</div>
  <div class="s">Walk around on your own, or watch it again.</div>
  <button id="again" type="button">Watch again</button>
  <button id="explore" type="button">Explore</button>
</div>

<div id="fade"></div>

<script>
/* ---- js/plan.js ---- */
/* Turns the editable plan (plan-data.js, or the copy saved by the plan editor in
   this browser) into everything the 3D model needs. Units are feet; see
   plan-data.js for the axes. Heights are measured up from the first floor finish. */
(function () {
  const A = (window.APP = window.APP || {});
  const KEY = 'arch.plan.firstfloor';
  A.PLAN_KEY = KEY;

  // Used when a plan file or a saved copy has no "areas" list yet.
  A.DEFAULT_AREAS = [
    { id: 'void', name: 'Double Height', kind: 'void', r: [9.375, 14.625, 26.125, 24.375] },
    { id: 'terrace', name: 'Terrace', kind: 'terrace', r: [0, 28.625, 8.875, 39] },
    { id: 'terrace-strip', name: 'Terrace', kind: 'terrace', r: [5.39, 39, 8.875, 47] },
    { id: 'front-balcony', name: 'Front Balcony', kind: 'balcony', r: [5.39, 47, 30.375, 50.54] },
    { id: 'rear-balcony', name: 'Rear Balcony', kind: 'balcony', r: [-3.5, -2, 30.375, 0] },
    { id: 'north-balcony', name: 'Rear Balcony', kind: 'balcony', r: [-3.5, 0, -1, 14.625] },
  ];

  A.DEFAULT_WARDROBES = [
    { id: 'dress-wardrobe-1', r: [22.625, 44.25, 29.25, 46.25], face: 'rear' },
    { id: 'dress-wardrobe-2', r: [27.25, 38.25, 29.25, 44.25], face: 'north', mirror: true },
  ];

  // --- pick the plan: the editor's saved copy wins, unless ?original=1 --------
  const base = window.PLAN_DATA;
  let D = base;
  A.planEdited = false;
  try {
    const q = new URLSearchParams(location.search);
    const s = window.PLAN_STANDALONE || q.get('original') === '1' ? null : localStorage.getItem(KEY);
    if (s) {
      const o = JSON.parse(s);
      if (o && o.version === base.version && Array.isArray(o.walls) && Array.isArray(o.pillars)) {
        D = Object.assign({}, base, { H: o.H, walls: o.walls, pillars: o.pillars, areas: o.areas || base.areas, wardrobes: o.wardrobes || base.wardrobes });
        A.planEdited = true;
      }
    }
  } catch (err) { /* storage not available: use the file as it is */ }

  const H = +D.H || 11;       // floor to ceiling
  const SLAB = D.SLAB;        // slab thickness (assumed)
  const GF = -(H + SLAB);     // ground floor level below the first floor
  const DOOR = D.DOOR;        // door and window head height (assumed)
  const zval = (v) => (v === 'GF' ? GF : v === 'H' ? H : v === 'TOP' ? H + SLAB : v === '-SLAB' ? -SLAB : +v);
  const zr = (z) => (z ? [zval(z[0]), zval(z[1])] : [0, H]);

  const walls = D.walls.map((w) => ({
    id: w.id, ax: w.ax, r: w.r.slice(), z: zr(w.z), mat: w.mat || 'wall',
    ops: (w.ops || []).map((o) => Object.assign({}, o, { head: Math.min(o.head, zr(w.z)[1]) })),
  }));
  const pillars = D.pillars.map((p) => ({ id: p.id, r: p.r.slice(), z: zr(p.z), mat: p.mat || 'wall' }));
  const areaList = (D.areas || A.DEFAULT_AREAS).map((a) => ({ id: a.id, name: a.name || a.id, kind: a.kind, r: a.r.slice() }));
  const areaById = {};
  for (const a of areaList) areaById[a.id] = a;
  // Wardrobes: footprint, the side the doors are on, and height (ceiling if not given).
  const wardrobes = (D.wardrobes || A.DEFAULT_WARDROBES).map((w) => ({ id: w.id, r: w.r.slice(), face: w.face || 'rear', h: Math.min(+w.h || H, H), mirror: !!w.mirror }));
  const voids = areaList.filter((a) => a.kind === 'void');
  const outdoor = areaList.filter((a) => a.kind !== 'void');

  // --- small rectangle kit ----------------------------------------------------
  const inRect = (x, y, r) => x > r[0] && x < r[2] && y > r[1] && y < r[3];
  function subtract(rects, hole) {
    const out = [];
    for (const r of rects) {
      const x0 = Math.max(r[0], hole[0]), y0 = Math.max(r[1], hole[1]), x1 = Math.min(r[2], hole[2]), y1 = Math.min(r[3], hole[3]);
      if (x1 <= x0 + 1e-6 || y1 <= y0 + 1e-6) { out.push(r); continue; }
      if (r[1] < y0) out.push([r[0], r[1], r[2], y0]);
      if (y1 < r[3]) out.push([r[0], y1, r[2], r[3]]);
      if (r[0] < x0) out.push([r[0], y0, x0, y1]);
      if (x1 < r[2]) out.push([x1, y0, r[2], y1]);
    }
    return out;
  }
  const uniq = (list) => Array.from(new Set(list.map((v) => Math.round(v * 1000) / 1000))).sort((a, b) => a - b);
  /* Edges of a set of floor rectangles that need a railing. needsRail(x, y, nx, ny)
     is asked about each edge piece, n being the direction away from the floor.
     Returns [{ dir, c, a, b, n }]: dir "y" runs along Y at X = c, dir "x" along X at Y = c. */
  function boundary(rects, needsRail, cutsX, cutsY) {
    const xs = uniq(rects.flatMap((r) => [r[0], r[2]]).concat(cutsX || [])), ys = uniq(rects.flatMap((r) => [r[1], r[3]]).concat(cutsY || []));
    const inside = (x, y) => rects.some((r) => inRect(x, y, r));
    const raw = [], e = 0.03;
    for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
      const cx = (xs[i] + xs[i + 1]) / 2, cy = (ys[j] + ys[j + 1]) / 2;
      if (!inside(cx, cy)) continue;
      if (!inside(xs[i] - e, cy) && needsRail(xs[i], cy, -1, 0)) raw.push(['y', xs[i], ys[j], ys[j + 1], -1]);
      if (!inside(xs[i + 1] + e, cy) && needsRail(xs[i + 1], cy, 1, 0)) raw.push(['y', xs[i + 1], ys[j], ys[j + 1], 1]);
      if (!inside(cx, ys[j] - e) && needsRail(cx, ys[j], 0, -1)) raw.push(['x', ys[j], xs[i], xs[i + 1], -1]);
      if (!inside(cx, ys[j + 1] + e) && needsRail(cx, ys[j + 1], 0, 1)) raw.push(['x', ys[j + 1], xs[i], xs[i + 1], 1]);
    }
    raw.sort((p, q) => (p[0] < q[0] ? -1 : p[0] > q[0] ? 1 : p[1] - q[1] || p[4] - q[4] || p[2] - q[2]));
    const out = [];
    for (const s of raw) {
      const last = out[out.length - 1];
      if (last && last.dir === s[0] && Math.abs(last.c - s[1]) < 1e-6 && last.n === s[4] && Math.abs(last.b - s[2]) < 1e-6) last.b = s[3];
      else out.push({ dir: s[0], c: s[1], a: s[2], b: s[3], n: s[4] });
    }
    return out;
  }

  // --- fixed parts of the building (not in the editor) -----------------------
  const ZONE = [-0.375, 14.625, 30.375, 27.875];   // lounge + gallery + void + main stair
  const STAIRWELL = [[20.29, 24.375, 30.375, 27.875], [26.125, 14.625, 30.375, 24.375]];
  // Floor of the middle zone: everything that is not the void or the stairwell.
  let midFloor = [ZONE];
  for (const v of voids) midFloor = subtract(midFloor, v.r);
  for (const s of STAIRWELL) midFloor = subtract(midFloor, s);

  const indoorSlabs = [
    [-1, 0, 30.375, 14.625],          // rear block
    [-0.375, 27.875, 8.875, 28.625],  // under the lounge / terrace wall
    [8.875, 27.875, 30.375, 47],      // master suite
  ];
  // Structural slab pieces (top just below finish level).
  const slabs = indoorSlabs.concat(midFloor, outdoor.map((a) => a.r));

  // Finish floors of the rooms: [x0, y0, x1, y1, material]
  const roomFloors = [
    [-0.25, 0.375, 19.25, 14.25, 'marble'],       // living and dining
    [-0.25, 14.25, 13.72, 14.625, 'marble'],      // where the wall to the lounge was taken out
    [19.25, 0.75, 29.625, 7.75, 'marble'],        // kitchen
    [27.125, 7.75, 29.625, 14.25, 'marble'],      // kitchen utility leg
    [19.2085, 8.125, 26.75, 14.25, 'bathfloor'],  // common washroom
    [9.25, 28.25, 22.25, 46.25, 'woodfloor'],     // master bedroom
    [22.625, 38.25, 29.625, 46.25, 'woodfloor'],  // dress
    [22.625, 28.25, 29.625, 37.875, 'bathfloor'], // master toilet
  ];
  const floors = roomFloors
    .concat(midFloor.map((r) => [r[0], r[1], r[2], r[3], 'marble']))
    .concat(outdoor.map((a) => [a.r[0], a.r[1], a.r[2], a.r[3], a.kind === 'terrace' ? 'deck' : 'stonefloor']));

  // Ceilings at H, plus a roof projection over the front balcony.
  const ceilings = [
    [-1, 0, 30.375, 14.625],
    [-0.375, 14.625, 30.375, 27.875],
    [-0.375, 27.875, 8.875, 28.625],
    [8.875, 27.875, 30.375, 47],
  ];
  const fb = areaById['front-balcony'];
  if (fb && fb.r[3] > 47.5) ceilings.push([Math.max(8.875, fb.r[0]), 47, fb.r[2], fb.r[3] + 0.36]);

  // Main stair down to the ground floor: 20 risers, three flights round the void.
  const RISE = (H + SLAB) / 20, TREAD = 10 / 12;

  // Rooms, for captions and the map.
  const ft = (v) => { const t = Math.round(Math.abs(v) * 24), f = Math.floor(t / 24), h = t - f * 24; return f + "'-" + Math.floor(h / 2) + (h % 2 ? '½' : '') + '"'; };
  const rooms = [
    { name: 'Living & Dining', size: "19'-6\" × 13'-10½\", open to the lounge", r: [-0.25, 0.375, 19.25, 14.625] },
    { name: 'Kitchen', size: "10'-4½\" × 7'-0\" + utility 2'-6\" × 6'-6\"", r: [19.25, 0.75, 29.625, 7.75] },
    { name: 'Kitchen', size: "10'-4½\" × 7'-0\" + utility 2'-6\" × 6'-6\"", r: [27.125, 7.75, 29.625, 14.25] },
    { name: 'Common Washroom', size: "7'-6\" × 6'-1½\"", r: [19.2085, 8.125, 26.75, 14.25] },
    { name: 'Master Bedroom', size: "13'-0\" × 18'-0\"", r: [9.25, 28.25, 22.25, 46.25] },
    { name: 'Dress', size: "7'-0\" × 8'-0\"", r: [22.625, 38.25, 29.625, 46.25] },
    { name: 'Master Toilet', size: "7'-0\" × 9'-7½\"", r: [22.625, 28.25, 29.625, 37.875] },
  ];
  for (const a of areaList) rooms.push({ name: a.name, size: ft(a.r[2] - a.r[0]) + ' × ' + ft(a.r[3] - a.r[1]), r: a.r, area: true });
  rooms.push(
    { name: 'Main Stair', size: "3'-6\" wide", r: [20.29, 24.375, 29.625, 27.875] },
    { name: 'Main Stair', size: "3'-6\" wide", r: [23.6, 14.625, 29.625, 24.375] },
    { name: 'Family Lounge', size: "12'-10\" × 13'-3\"", r: [0.375, 14.625, 13.2, 27.875] },
    { name: 'Gallery', size: "beside the double height", r: [9.375, 14.625, 29.625, 27.875] }
  );

  /* Where there is a floor to stand on: [x0, y0, x1, y1, height]. Height may be
     a function of (x, y) on the stairs. Walls, railings and furniture are
     checked separately, so these are the plain floor areas. */
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const f1 = (x) => -clamp01((x - 20.29) / 5.835) * 8 * RISE;
  const f2 = (x, y) => -8 * RISE - clamp01((23.96 - y) / 5.835) * 8 * RISE;
  const f3 = (x) => -16 * RISE - clamp01((26.125 - x) / 2.5) * 4 * RISE;
  const areas = slabs.map((s) => [s[0], s[1], s[2], s[3], 0]).concat([
    [20.29, 24.375, 26.125, 27.875, f1],      // main stair, top flight
    [26.125, 23.96, 29.625, 27.875, -8 * RISE],
    [26.125, 18.125, 29.625, 23.96, f2],
    [26.125, 14.625, 29.625, 18.125, -16 * RISE],
    [23.62, 14.625, 26.125, 18.125, f3],
    [9.375, 14.625, 23.62, 27.875, GF],       // placeholder room under the void
    [23.62, 18.125, 26.125, 27.875, GF],
  ]);

  /* Solid pieces a person cannot walk through, worked out from the walls:
     [x0, y0, x1, y1, bottom, top]. Open doors and cased openings leave a gap. */
  const solids = [];
  for (const w of walls) {
    const [x0, y0, x1, y1] = w.r, [z0, z1] = w.z;
    const lo = w.ax === 'x' ? x0 : y0, hi = w.ax === 'x' ? x1 : y1;
    const piece = (a, b, za, zb) => { if (b - a > 1e-4 && zb - za > 1e-4) solids.push(w.ax === 'x' ? [a, y0, b, y1, za, zb] : [x0, a, x1, b, za, zb]); };
    let cur = lo;
    for (const o of w.ops.slice().sort((p, q) => p.a - q.a)) {
      piece(cur, o.a, z0, z1);
      const passable = o.type === 'open' || ((o.type === 'door' || o.type === 'gdoor') && o.isOpen);
      if (!passable) piece(o.a, o.b, z0, o.head);
      cur = o.b;
    }
    piece(cur, hi, z0, z1);
  }
  for (const p of pillars) solids.push([p.r[0], p.r[1], p.r[2], p.r[3], p.z[0], p.z[1]]);

  // --- railings, worked out from the floor edges ------------------------------
  // Glass railing wherever first-floor floor meets the void or the stairwell,
  // except across the top step of the main stair.
  const holes = voids.map((v) => v.r).concat(STAIRWELL);
  const glass = boundary(midFloor, (x, y, nx, ny) => {
    const qx = x + nx * 0.05, qy = y + ny * 0.05;
    if (!holes.some((h) => inRect(qx, qy, h))) return false;
    if (nx === 1 && Math.abs(x - 20.29) < 0.01 && y > 24.375 && y < 27.875) return false;
    return true;
  });
  // Jaali railing on every open edge of a terrace or balcony: not where it meets
  // the building, another open area, or a wall / parapet / pillar.
  const guards = walls.concat(pillars).filter((w) => w.z[0] < 0.5 && w.z[1] > 3).map((w) => w.r);
  const jaali = boundary(outdoor.map((a) => a.r), (x, y, nx, ny) => {
    const ox = x + nx * 0.1, oy = y + ny * 0.1, ix = x - nx * 0.1, iy = y - ny * 0.1;
    if (slabs.some((s) => inRect(ox, oy, s))) return false;
    if (guards.some((g) => inRect(ox, oy, g) || inRect(ix, iy, g))) return false;
    return true;
  }, guards.flatMap((g) => [g[0], g[2]]), guards.flatMap((g) => [g[1], g[3]]));

  const v0 = voids[0];
  const voidCenter = v0 ? [(v0.r[0] + Math.min(v0.r[2], 24.5)) / 2, (v0.r[1] + v0.r[3]) / 2] : [17, 19.6];

  A.plan = {
    H, SLAB, GF, DOOR, RISE, TREAD, walls, pillars, slabs, floors, roomFloors, ceilings, rooms, areas, solids,
    areaList, areaById, voids, midFloor, wardrobes, ZONE, STAIRWELL, rails: { glass, jaali }, voidCenter,
  };
})();

<script>
/* ---- js/materials.js ---- */
/* Procedural textures and the material palette: warm contemporary with Jaipur touches. */
(function () {
  const A = (window.APP = window.APP || {});
  const T = THREE;

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function tex(size, draw, seed) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    draw(g, size, rng(seed || 1));
    const t = new T.CanvasTexture(c);
    t.colorSpace = T.SRGBColorSpace;
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.anisotropy = 8;
    return t;
  }

  function clouds(g, s, R, n, cols, amin, amax) {
    for (let i = 0; i < n; i++) {
      const x = R() * s, y = R() * s, r = s * (0.04 + R() * 0.14);
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      const c = cols[(R() * cols.length) | 0], a = amin + R() * (amax - amin);
      gr.addColorStop(0, `rgba(${c},${a})`);
      gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr;
      g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  }
  function speckle(g, s, R, n, col, a) {
    for (let i = 0; i < n; i++) {
      g.fillStyle = `rgba(${col},${R() * a})`;
      g.fillRect(R() * s, R() * s, 1 + R() * 2, 1 + R() * 2);
    }
  }
  function grout(g, s, nx, ny, col, w) {
    g.fillStyle = col;
    for (let i = 0; i < nx; i++) g.fillRect((i * s) / nx - w / 2, 0, w, s);
    for (let j = 0; j < ny; j++) g.fillRect(0, (j * s) / ny - w / 2, s, w);
    g.fillRect(s - w / 2, 0, w, s);
    g.fillRect(0, s - w / 2, s, w);
  }

  function marble(g, s, R, base, vein, nx, ny) {
    g.fillStyle = base;
    g.fillRect(0, 0, s, s);
    clouds(g, s, R, 70, ['255,255,255', '196,180,154'], 0.04, 0.1);
    for (let i = 0; i < 16; i++) {
      let x = R() * s, y = R() * s, ang = R() * Math.PI * 2;
      g.beginPath();
      g.moveTo(x, y);
      const n = 20 + R() * 30;
      for (let k = 0; k < n; k++) {
        ang += (R() - 0.5) * 0.7;
        x += Math.cos(ang) * 14;
        y += Math.sin(ang) * 14;
        g.lineTo(x, y);
      }
      g.strokeStyle = `rgba(${vein},${0.08 + R() * 0.16})`;
      g.lineWidth = 0.6 + R() * 1.8;
      g.stroke();
    }
    grout(g, s, nx, ny, 'rgba(120,108,92,0.55)', 2);
  }

  function wood(g, s, R, hue, sat, lum, plank, gap, vary) {
    for (let y = 0; y < s; y += plank) {
      let x = -R() * s * 0.5;
      while (x < s) {
        const len = s * (0.45 + R() * 0.5);
        g.fillStyle = `hsl(${hue + (R() - 0.5) * 6},${sat}%,${lum + (R() - 0.5) * vary}%)`;
        g.fillRect(x, y, len, plank);
        for (let k = 0; k < plank * 0.5; k++) {
          const yy = y + R() * plank;
          g.strokeStyle = `rgba(50,28,10,${0.03 + R() * 0.07})`;
          g.lineWidth = 0.5 + R();
          g.beginPath();
          g.moveTo(x, yy);
          g.bezierCurveTo(x + len * 0.3, yy + (R() - 0.5) * 4, x + len * 0.6, yy + (R() - 0.5) * 4, x + len, yy + (R() - 0.5) * 3);
          g.stroke();
        }
        g.fillStyle = `rgba(25,14,6,${gap})`;
        g.fillRect(x + len - 1.5, y, 1.5, plank);
        x += len;
      }
      g.fillStyle = `rgba(25,14,6,${gap})`;
      g.fillRect(0, y, s, 1.5);
    }
  }

  function stoneTile(g, s, R, base, nx, ny) {
    g.fillStyle = base;
    g.fillRect(0, 0, s, s);
    clouds(g, s, R, 50, ['255,235,220', '150,95,75'], 0.03, 0.08);
    speckle(g, s, R, 5000, '90,50,35', 0.12);
    speckle(g, s, R, 3000, '255,240,230', 0.12);
    grout(g, s, nx, ny, 'rgba(110,80,66,0.6)', 3);
  }

  function cladding(g, s, R) {
    g.fillStyle = '#8f8271';
    g.fillRect(0, 0, s, s);
    let y = 0;
    while (y < s) {
      const h = 14 + R() * 22;
      let x = -R() * 80;
      while (x < s) {
        const w = 60 + R() * 150;
        const l = 62 + R() * 16;
        g.fillStyle = `hsl(${32 + R() * 8},${18 + R() * 10}%,${l}%)`;
        g.fillRect(x + 1, y + 1, w - 2, h - 2);
        g.fillStyle = 'rgba(255,255,255,0.10)';
        g.fillRect(x + 1, y + 1, w - 2, 2);
        g.fillStyle = 'rgba(0,0,0,0.12)';
        g.fillRect(x + 1, y + h - 3, w - 2, 2);
        x += w;
      }
      y += h;
    }
    speckle(g, s, R, 6000, '60,45,30', 0.1);
  }

  function fluted(g, s, R) {
    const n = 16, w = s / n;
    for (let i = 0; i < n; i++) {
      const gr = g.createLinearGradient(i * w, 0, (i + 1) * w, 0);
      gr.addColorStop(0, '#5f4029');
      gr.addColorStop(0.25, '#a47550');
      gr.addColorStop(0.6, '#8b603f');
      gr.addColorStop(1, '#4b301d');
      g.fillStyle = gr;
      g.fillRect(i * w, 0, w + 1, s);
    }
    speckle(g, s, R, 4000, '40,22,10', 0.08);
  }

  function rug(g, s, R, bg, fg, ac) {
    g.fillStyle = bg;
    g.fillRect(0, 0, s, s);
    speckle(g, s, R, 9000, '255,255,255', 0.06);
    g.strokeStyle = fg;
    g.lineWidth = s * 0.012;
    g.strokeRect(s * 0.04, s * 0.04, s * 0.92, s * 0.92);
    g.lineWidth = s * 0.006;
    g.strokeRect(s * 0.075, s * 0.075, s * 0.85, s * 0.85);
    const n = 5, c = (s * 0.8) / n;
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++) {
        const cx = s * 0.1 + c * (i + 0.5), cy = s * 0.1 + c * (j + 0.5), r = c * 0.36;
        g.beginPath();
        g.moveTo(cx, cy - r); g.lineTo(cx + r, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r, cy);
        g.closePath();
        g.strokeStyle = (i + j) % 2 ? fg : ac;
        g.lineWidth = s * 0.006;
        g.stroke();
        g.fillStyle = (i + j) % 2 ? ac : fg;
        g.fillRect(cx - r * 0.14, cy - r * 0.14, r * 0.28, r * 0.28);
      }
  }

  function art(g, s, R, pal) {
    g.fillStyle = pal[0];
    g.fillRect(0, 0, s, s);
    for (let i = 0; i < 7; i++) {
      g.fillStyle = pal[1 + ((R() * (pal.length - 1)) | 0)];
      g.globalAlpha = 0.75 + R() * 0.25;
      if (R() < 0.5) {
        g.beginPath();
        g.arc(R() * s, R() * s, s * (0.1 + R() * 0.25), R() * 6.3, R() * 6.3);
        g.closePath();
        g.fill();
      } else {
        g.fillRect(R() * s * 0.8, R() * s * 0.8, s * (0.1 + R() * 0.4), s * (0.08 + R() * 0.3));
      }
    }
    g.globalAlpha = 1;
    speckle(g, s, R, 5000, '255,255,255', 0.08);
  }

  function jaali(g, s) {
    g.clearRect(0, 0, s, s);
    g.fillStyle = '#3b2f28';
    g.fillRect(0, 0, s, s);
    g.globalCompositeOperation = 'destination-out';
    const n = 2, c = s / n;
    for (let i = 0; i < n; i++)
      for (let j = 0; j < n; j++) {
        const cx = c * (i + 0.5), cy = c * (j + 0.5), r = c * 0.36;
        // eight-point star: two overlapping squares
        for (let k = 0; k < 2; k++) {
          g.save();
          g.translate(cx, cy);
          g.rotate((k * Math.PI) / 4);
          g.fillRect(-r * 0.78, -r * 0.78, r * 1.56, r * 1.56);
          g.restore();
        }
      }
    // small diamonds at the corners of each cell
    for (let i = 0; i <= n; i++)
      for (let j = 0; j <= n; j++) {
        g.save();
        g.translate(i * c, j * c);
        g.rotate(Math.PI / 4);
        g.fillRect(-c * 0.11, -c * 0.11, c * 0.22, c * 0.22);
        g.restore();
      }
    g.globalCompositeOperation = 'source-over';
  }

  A.texKit = { tex, marble, wood, rug, art };

  A.buildMaterials = function () {
    const M = {}, S = {}; // S = feet per texture repeat, used for world-scale UVs
    const std = (o) => new T.MeshStandardMaterial(o);

    const tMarble = tex(1024, (g, s, R) => marble(g, s, R, '#e9e2d5', '140,122,98', 2, 1), 11);
    const tBath = tex(512, (g, s, R) => marble(g, s, R, '#cfc8bb', '120,112,100', 2, 2), 12);
    const tBathW = tex(512, (g, s, R) => marble(g, s, R, '#e2dccf', '150,138,120', 1, 2), 13);
    const tWoodF = tex(1024, (g, s, R) => wood(g, s, R, 30, 36, 50, 128, 0.5, 9), 21);
    const tDeck = tex(512, (g, s, R) => wood(g, s, R, 28, 16, 42, 64, 0.8, 8), 22);
    const tTeak = tex(512, (g, s, R) => wood(g, s, R, 26, 44, 36, 512, 0, 3), 23);
    const tTeakV = tTeak.clone(); tTeakV.rotation = Math.PI / 2; tTeakV.needsUpdate = true;
    const tWalnut = tex(512, (g, s, R) => wood(g, s, R, 24, 30, 20, 512, 0, 3), 24);
    const tStone = tex(1024, (g, s, R) => stoneTile(g, s, R, '#d6a48c', 2, 2), 31);
    const tStoneW = tex(1024, (g, s, R) => stoneTile(g, s, R, '#d9ab93', 1, 3), 32);
    const tClad = tex(1024, cladding, 33);
    const tFlute = tex(512, fluted, 34);
    const tJaali = tex(256, jaali, 1);
    tJaali.anisotropy = 4;

    M.wall = std({ color: 0xf2ede3, roughness: 0.93 });
    M.ceiling = std({ color: 0xfaf8f4, roughness: 0.95 });
    M.marble = std({ map: tMarble, roughness: 0.22, metalness: 0.0, envMapIntensity: 0.55 }); S.marble = 4;
    M.stair = std({ map: tMarble, color: 0xe8dcc8, roughness: 0.3, envMapIntensity: 0.5 }); S.stair = 4;
    M.bathfloor = std({ map: tBath, roughness: 0.45 }); S.bathfloor = 4;
    M.bathwall = std({ map: tBathW, roughness: 0.3, envMapIntensity: 0.5 }); S.bathwall = 4;
    M.woodfloor = std({ map: tWoodF, roughness: 0.5 }); S.woodfloor = 4;
    M.deck = std({ map: tDeck, roughness: 0.8 }); S.deck = 3;
    M.stonefloor = std({ map: tStone, roughness: 0.85 }); S.stonefloor = 4;
    M.stone = std({ map: tStoneW, roughness: 0.9 }); S.stone = 4;
    M.cladding = std({ map: tClad, roughness: 0.92 }); S.cladding = 5;
    M.teak = std({ map: tTeak, roughness: 0.55 }); S.teak = 3;
    M.teakV = std({ map: tTeakV, roughness: 0.55 }); S.teakV = 3;
    M.walnut = std({ map: tWalnut, roughness: 0.5 }); S.walnut = 3;
    M.fluted = std({ map: tFlute, roughness: 0.6 }); S.fluted = 2.2;
    M.frame = std({ color: 0x2f2a27, roughness: 0.45, metalness: 0.6 });
    M.metal = std({ color: 0x3a302a, roughness: 0.5, metalness: 0.7 });
    M.brass = std({ color: 0xc9a25a, roughness: 0.28, metalness: 1.0 });
    M.chrome = std({ color: 0xdadada, roughness: 0.12, metalness: 1.0 });
    M.glass = new T.MeshStandardMaterial({ color: 0xcfe3e6, roughness: 0.04, metalness: 0.1, transparent: true, opacity: 0.16, depthWrite: false, envMapIntensity: 1.2 });
    M.railglass = new T.MeshStandardMaterial({ color: 0xbfe0dc, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.2, depthWrite: false, side: T.DoubleSide, envMapIntensity: 1.3 });
    M.frost = std({ color: 0xdfe9ea, roughness: 0.6, emissive: 0x9fb4b8, emissiveIntensity: 0.5 });
    // one mirror material per room: each gets its own reflection of that room (see main.js)
    for (const k of ['mirror', 'mirror2', 'mirror3']) M[k] = std({ color: 0xe6ecee, roughness: 0.04, metalness: 1.0, envMapIntensity: 1.0 });
    M.jaali = std({ map: tJaali, alphaTest: 0.5, side: T.DoubleSide, roughness: 0.5, metalness: 0.6 });
    M.white = std({ color: 0xf6f4ef, roughness: 0.35 });
    M.ceramic = std({ color: 0xfbfbf8, roughness: 0.12, envMapIntensity: 0.9 });
    M.quartz = std({ color: 0xf1eee8, roughness: 0.2, envMapIntensity: 0.7 });
    M.sage = std({ color: 0x8c9a84, roughness: 0.6 });
    M.black = std({ color: 0x141414, roughness: 0.35, metalness: 0.3 });
    M.screen = std({ color: 0x07090c, roughness: 0.08, metalness: 0.4, envMapIntensity: 1.0 });
    M.steel = std({ color: 0xb9bcbf, roughness: 0.3, metalness: 0.9 });
    // fabrics
    M.fabIvory = std({ color: 0xe7dfd0, roughness: 0.97 });
    M.fabSand = std({ color: 0xc9b79c, roughness: 0.97 });
    M.fabTerra = std({ color: 0xb8674a, roughness: 0.97 });
    M.fabMustard = std({ color: 0xc99a3c, roughness: 0.97 });
    M.fabTeal = std({ color: 0x3f6f73, roughness: 0.97 });
    M.fabGrey = std({ color: 0x8c8a85, roughness: 0.97 });
    M.fabWhite = std({ color: 0xf5f2ec, roughness: 0.97 });
    M.sheer = new T.MeshStandardMaterial({ color: 0xfaf6ee, roughness: 1, transparent: true, opacity: 0.5, side: T.DoubleSide, depthWrite: false });
    M.leaf = std({ color: 0x4f7a45, roughness: 0.8, flatShading: true });
    M.leaf2 = std({ color: 0x6b9156, roughness: 0.8, flatShading: true });
    M.pot = std({ color: 0xb5694d, roughness: 0.85 });
    M.potWhite = std({ color: 0xe9e4da, roughness: 0.7 });
    M.glow = std({ color: 0xfff1d6, emissive: 0xffd9a0, emissiveIntensity: 2.2, roughness: 0.6 });
    M.glowSoft = std({ color: 0xfff1d6, emissive: 0xffd39a, emissiveIntensity: 0.9, roughness: 0.8 });
    // context
    M.ground = std({ color: 0xa7a38f, roughness: 1 });
    M.road = std({ color: 0x4a4a4c, roughness: 1 });
    M.grass = std({ color: 0x7c9462, roughness: 1 });
    M.trunk = std({ color: 0x6a4e37, roughness: 1 });
    M.nb1 = std({ color: 0xe6d9c6, roughness: 0.95 });
    M.nb2 = std({ color: 0xd9b8a3, roughness: 0.95 });
    M.nb3 = std({ color: 0xcfd6d2, roughness: 0.95 });
    M.nbwin = std({ color: 0x38454d, roughness: 0.2, metalness: 0.3 });

    const rugTex = (bg, fg, ac, seed) => { const t = tex(512, (g, s, R) => rug(g, s, R, bg, fg, ac), seed); t.wrapS = t.wrapT = T.ClampToEdgeWrapping; return t; };
    M.rugLiving = std({ map: rugTex('#b46a4c', '#f0e4cf', '#e3b65c', 41), roughness: 1 });
    M.rugLounge = std({ map: rugTex('#c7a04a', '#f3ead8', '#7a4a33', 42), roughness: 1 });
    M.rugBed = std({ map: rugTex('#6f8587', '#efe8da', '#d9c08a', 43), roughness: 1 });
    M.rugGF = std({ map: rugTex('#8b8478', '#e9e1d2', '#c7a877', 44), roughness: 1 });
    const artTex = (pal, seed) => { const t = tex(512, (g, s, R) => art(g, s, R, pal), seed); t.wrapS = t.wrapT = T.ClampToEdgeWrapping; return t; };
    M.art1 = std({ map: artTex(['#efe6d6', '#b8674a', '#c99a3c', '#3f6f73', '#2e2a28'], 51), roughness: 0.9 });
    M.art2 = std({ map: artTex(['#e9dfd0', '#3f6f73', '#d6a48c', '#c99a3c'], 52), roughness: 0.9 });
    M.art3 = std({ map: artTex(['#f1e9db', '#b8674a', '#8c9a84', '#2e2a28'], 53), roughness: 0.9 });
    M.art4 = std({ map: artTex(['#d9c9b0', '#7a4a33', '#3f6f73', '#f3ead8'], 54), roughness: 0.9 });

    for (const k in S) M[k].userData.s = S[k];
    A.M = M;
    A.S = S;
    return M;
  };
})();

<script>
/* ---- js/styles.js ---- */
/* Three interior styles for the same home. A style only changes finishes
   (paint, floor, timber, fabric, metal, rugs, art), so switching is instant. */
(function () {
  const A = (window.APP = window.APP || {});

  // wood = [hue, saturation %, lightness %]
  A.STYLES = {
    modern: {
      label: 'Modern', wall: 0xf3f3f1, ceiling: 0xfbfbfa,
      floor: { kind: 'stone', base: '#d9d9d6', vein: '96,98,104', rough: 0.2 },
      bedfloor: [28, 12, 40], wood: [24, 20, 26], dark: [20, 8, 13], flute: ['#1f2022', '#4a4c50', '#35373a', '#17181a'],
      accent: { c: 0x1d1d1f, r: 0.38, m: 0.85 }, frame: 0x151516, cab: 0x2f3337, counter: 0xf4f4f2,
      fab: { Ivory: 0xe8e8e5, Sand: 0xbfc1c2, Terra: 0x3b4046, Mustard: 0xc6c1b7, Teal: 0x2f4a66, Grey: 0x6f7377 },
      rugs: [['#3e4247', '#e6e6e3', '#9aa0a6'], ['#c9c9c5', '#3a3d41', '#2f4a66'], ['#55595f', '#e9e9e6', '#b9bcc0'], ['#8a8d91', '#ececea', '#3a3d41']],
      art: [['#ececea', '#1d1d1f', '#2f4a66', '#9aa0a6'], ['#dedede', '#2f4a66', '#1d1d1f', '#c6c1b7'], ['#f1f1ef', '#3b4046', '#9aa0a6', '#1d1d1f'], ['#cfd2d6', '#1d1d1f', '#2f4a66', '#f1f1ef']],
      clad: 0xc9ccd1, pot: 0x2b2b2d, glow: 0xfff0dc,
    },
    scandi: {
      label: 'Scandinavian', wall: 0xfbfaf6, ceiling: 0xffffff,
      floor: { kind: 'wood', wood: [36, 34, 70], rough: 0.55 },
      bedfloor: [36, 32, 68], wood: [36, 40, 63], dark: [33, 30, 50], flute: ['#b9976b', '#e6cfa6', '#d3b88a', '#a78458'],
      accent: { c: 0x2a2a2a, r: 0.5, m: 0.6 }, frame: 0xe7e5df, cab: 0xe9e6de, counter: 0xe7e1d6,
      fab: { Ivory: 0xf2eee5, Sand: 0xdad3c5, Terra: 0xc9a79a, Mustard: 0xdcc99a, Teal: 0x9db0a3, Grey: 0xb9b8b1 },
      rugs: [['#e7e0d2', '#8f9c8f', '#c9a79a'], ['#dcd6c8', '#6f7b70', '#dcc99a'], ['#e9e3d6', '#9db0a3', '#b7a58a'], ['#d8d2c4', '#f4f0e8', '#8f9c8f']],
      art: [['#f4f0e8', '#9db0a3', '#c9a79a', '#3a3a38'], ['#efe9dd', '#dcc99a', '#9db0a3', '#6f7b70'], ['#f6f2ea', '#c9a79a', '#3a3a38', '#b7a58a'], ['#e9e3d6', '#6f7b70', '#f6f2ea', '#dcc99a']],
      clad: 0xf1ede5, pot: 0xe6e0d4, glow: 0xffe9c8,
    },
    luxury: {
      label: 'Warm luxury', wall: 0xf2ede3, ceiling: 0xfaf8f4,
      floor: { kind: 'stone', base: '#e9e2d5', vein: '140,122,98', rough: 0.22 },
      bedfloor: [30, 36, 50], wood: [26, 44, 36], dark: [24, 30, 20], flute: ['#5f4029', '#a47550', '#8b603f', '#4b301d'],
      accent: { c: 0xc9a25a, r: 0.28, m: 1.0 }, frame: 0x2f2a27, cab: 0x8c9a84, counter: 0xf1eee8,
      fab: { Ivory: 0xe7dfd0, Sand: 0xc9b79c, Terra: 0xb8674a, Mustard: 0xc99a3c, Teal: 0x3f6f73, Grey: 0x8c8a85 },
      rugs: [['#b46a4c', '#f0e4cf', '#e3b65c'], ['#c7a04a', '#f3ead8', '#7a4a33'], ['#6f8587', '#efe8da', '#d9c08a'], ['#8b8478', '#e9e1d2', '#c7a877']],
      art: [['#efe6d6', '#b8674a', '#c99a3c', '#3f6f73', '#2e2a28'], ['#e9dfd0', '#3f6f73', '#d6a48c', '#c99a3c'], ['#f1e9db', '#b8674a', '#8c9a84', '#2e2a28'], ['#d9c9b0', '#7a4a33', '#3f6f73', '#f3ead8']],
      clad: 0xffffff, pot: 0xb5694d, glow: 0xffd9a0,
    },
  };

  const cache = {};
  function textures(name) {
    if (cache[name]) return cache[name];
    const T = THREE, K = A.texKit, st = A.STYLES[name], seed = { modern: 100, scandi: 200, luxury: 300 }[name];
    const woodTex = (w, plank, gap, vary, size, sd) => K.tex(size, (g, s, R) => K.wood(g, s, R, w[0], w[1], w[2], plank, gap, vary), seed + sd);
    const clampT = (t) => { t.wrapS = t.wrapT = T.ClampToEdgeWrapping; return t; };
    const o = {};
    o.floor = st.floor.kind === 'wood' ? woodTex(st.floor.wood, 128, 0.4, 7, 1024, 1) : K.tex(1024, (g, s, R) => K.marble(g, s, R, st.floor.base, st.floor.vein, 2, 1), seed + 1);
    o.bedfloor = woodTex(st.bedfloor, 128, 0.5, 9, 1024, 2);
    o.wood = woodTex(st.wood, 512, 0, 3, 512, 3);
    o.woodV = o.wood.clone(); o.woodV.rotation = Math.PI / 2; o.woodV.needsUpdate = true;
    o.dark = woodTex(st.dark, 512, 0, 3, 512, 4);
    o.flute = K.tex(512, (g, s, R) => {
      const n = 16, w = s / n;
      for (let i = 0; i < n; i++) {
        const gr = g.createLinearGradient(i * w, 0, (i + 1) * w, 0);
        gr.addColorStop(0, st.flute[0]); gr.addColorStop(0.25, st.flute[1]); gr.addColorStop(0.6, st.flute[2]); gr.addColorStop(1, st.flute[3]);
        g.fillStyle = gr; g.fillRect(i * w, 0, w + 1, s);
      }
    }, seed + 5);
    o.rugs = st.rugs.map((c, i) => clampT(K.tex(512, (g, s, R) => K.rug(g, s, R, c[0], c[1], c[2]), seed + 10 + i)));
    o.art = st.art.map((pal, i) => clampT(K.tex(512, (g, s, R) => K.art(g, s, R, pal), seed + 20 + i)));
    return (cache[name] = o);
  }

  A.setStyle = function (name) {
    if (!A.STYLES[name]) name = 'luxury';
    const st = A.STYLES[name], M = A.M, t = textures(name);
    const map = (m, tex) => { m.map = tex; m.needsUpdate = true; };
    A.style = name;
    M.wall.color.setHex(st.wall);
    M.ceiling.color.setHex(st.ceiling);
    map(M.marble, t.floor); M.marble.roughness = st.floor.rough; M.marble.color.setHex(0xffffff);
    map(M.stair, t.floor); M.stair.roughness = st.floor.rough + 0.08; M.stair.color.setHex(st.floor.kind === 'wood' ? 0xffffff : 0xf1e9dc);
    map(M.woodfloor, t.bedfloor);
    map(M.teak, t.wood); map(M.teakV, t.woodV); map(M.walnut, t.dark); map(M.fluted, t.flute);
    M.brass.color.setHex(st.accent.c); M.brass.roughness = st.accent.r; M.brass.metalness = st.accent.m;
    M.frame.color.setHex(st.frame); M.frame.metalness = name === 'scandi' ? 0.1 : 0.6;
    M.sage.color.setHex(st.cab);
    M.quartz.color.setHex(st.counter);
    for (const k in st.fab) M['fab' + k].color.setHex(st.fab[k]);
    [M.rugLiving, M.rugLounge, M.rugBed, M.rugGF].forEach((m, i) => map(m, t.rugs[i]));
    [M.art1, M.art2, M.art3, M.art4].forEach((m, i) => map(m, t.art[i]));
    M.cladding.color.setHex(st.clad);
    M.pot.color.setHex(st.pot);
    M.glow.emissive.setHex(st.glow); M.glowSoft.emissive.setHex(st.glow);
    document.querySelectorAll('[data-style]').forEach((b) => b.classList.toggle('on', b.dataset.style === name));
    if (A.onStyle) A.onStyle(name);
  };

  A.bindStyleButtons = function () {
    document.querySelectorAll('[data-style]').forEach((b) => b.addEventListener('click', () => A.setStyle(b.dataset.style)));
  };
})();

</script>
<script>
/* ---- js/shell.js ---- */
/* Builds the building shell from APP.plan: walls with openings, floors, ceilings,
   both stairs, railings, windows and doors, plus simple surroundings. */
(function () {
  const A = (window.APP = window.APP || {});
  const T = THREE;

  // --- small geometry kit -------------------------------------------------
  function worldUV(g, s) {
    const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) {
      const nx = Math.abs(n.getX(i)), ny = Math.abs(n.getY(i));
      let u, v;
      if (ny > 0.5) { u = p.getX(i); v = p.getZ(i); }
      else if (nx > 0.5) { u = p.getZ(i); v = p.getY(i); }
      else { u = p.getX(i); v = p.getY(i); }
      uv.setXY(i, u / s, v / s);
    }
  }
  function merge(geos) {
    let nV = 0, nI = 0;
    for (const g of geos) { nV += g.attributes.position.count; nI += g.index.count; }
    const pos = new Float32Array(nV * 3), nor = new Float32Array(nV * 3), uv = new Float32Array(nV * 2);
    const idx = new Uint32Array(nI);
    let vo = 0, io = 0;
    for (const g of geos) {
      pos.set(g.attributes.position.array, vo * 3);
      nor.set(g.attributes.normal.array, vo * 3);
      uv.set(g.attributes.uv.array, vo * 2);
      const gi = g.index.array;
      for (let k = 0; k < gi.length; k++) idx[io + k] = gi[k] + vo;
      vo += g.attributes.position.count;
      io += gi.length;
      g.dispose();
    }
    const out = new T.BufferGeometry();
    out.setAttribute('position', new T.BufferAttribute(pos, 3));
    out.setAttribute('normal', new T.BufferAttribute(nor, 3));
    out.setAttribute('uv', new T.BufferAttribute(uv, 2));
    out.setIndex(new T.BufferAttribute(idx, 1));
    out.computeBoundingSphere();
    out.computeBoundingBox();
    return out;
  }
  A.kit = { worldUV, merge };

  /* A batcher collects axis-aligned boxes per material and turns them into one
     mesh each, which keeps the draw-call count low. */
  function Batcher() {
    this.b = {};
  }
  Batcher.prototype.box = function (mk, x0, y0, x1, y1, z0, z1, grp) {
    if (x1 - x0 < 1e-4 || y1 - y0 < 1e-4 || z1 - z0 < 1e-4) return;
    const g = new T.BoxGeometry(x1 - x0, z1 - z0, y1 - y0);
    g.translate((x0 + x1) / 2, (z0 + z1) / 2, (y0 + y1) / 2);
    worldUV(g, A.S[mk] || 4);
    const key = (grp || 'main') + '|' + mk;
    (this.b[key] = this.b[key] || []).push(g);
  };
  Batcher.prototype.flush = function (groups) {
    for (const key in this.b) {
      const [grp, mk] = key.split('|');
      const m = new T.Mesh(merge(this.b[key]), A.M[mk]);
      const see = mk === 'glass' || mk === 'railglass';
      m.castShadow = !see;
      m.receiveShadow = !see;
      if (see) m.renderOrder = 5;
      m.name = key;
      groups[grp].add(m);
    }
    this.b = {};
  };
  A.Batcher = Batcher;

  A.buildShell = function (scene) {
    const P = A.plan, M = A.M;
    const { H, SLAB, GF, RISE, TREAD } = P;
    const groups = { main: new T.Group(), ceil: new T.Group(), ctx: new T.Group() };
    groups.main.name = 'shell';
    groups.ceil.name = 'ceilings';
    groups.ctx.name = 'context';
    const B = new Batcher();
    const box = (mk, x0, y0, x1, y1, z0, z1, grp) => B.box(mk, x0, y0, x1, y1, z0, z1, grp);
    // wall-local box: u along the wall, v across its thickness
    const lb = (mk, ax, u0, u1, v0, v1, z0, z1) =>
      ax === 'x' ? box(mk, u0, v0, u1, v1, z0, z1) : box(mk, v0, u0, v1, u1, z0, z1);

    // --- door leaves ------------------------------------------------------
    function leaf(ax, u0, u1, v0, v1, z0, z1, glazed) {
      const alongU = u1 - u0 > v1 - v0;
      if (!glazed) {
        lb('teakV', ax, u0, u1, v0, v1, z0, z1);
        // handle
        if (alongU) lb('brass', ax, u1 - 0.42, u1 - 0.3, v0 - 0.12, v1 + 0.12, 3.25, 3.75);
        else lb('brass', ax, u0 - 0.12, u1 + 0.12, v1 - 0.42, v1 - 0.3, 3.25, 3.75);
        return;
      }
      const st = 0.3, bot = 0.6;
      if (alongU) {
        lb('teakV', ax, u0, u0 + st, v0, v1, z0, z1);
        lb('teakV', ax, u1 - st, u1, v0, v1, z0, z1);
        lb('teakV', ax, u0 + st, u1 - st, v0, v1, z0, z0 + bot);
        lb('teakV', ax, u0 + st, u1 - st, v0, v1, z1 - st, z1);
        const c = (v0 + v1) / 2;
        lb('glass', ax, u0 + st, u1 - st, c - 0.015, c + 0.015, z0 + bot, z1 - st);
        lb('brass', ax, u1 - 0.22, u1 - 0.1, v0 - 0.12, v1 + 0.12, 3.2, 3.9);
      } else {
        lb('teakV', ax, u0, u1, v0, v0 + st, z0, z1);
        lb('teakV', ax, u0, u1, v1 - st, v1, z0, z1);
        lb('teakV', ax, u0, u1, v0 + st, v1 - st, z0, z0 + bot);
        lb('teakV', ax, u0, u1, v0 + st, v1 - st, z1 - st, z1);
        const c = (u0 + u1) / 2;
        lb('glass', ax, c - 0.015, c + 0.015, v0 + st, v1 - st, z0 + bot, z1 - st);
      }
    }

    // --- openings ---------------------------------------------------------
    function opening(ax, t0, t1, o) {
      const c = (t0 + t1) / 2, a = o.a, b = o.b, sill = o.sill || 0, head = o.head;
      if (o.type === 'win' || o.type === 'vent') {
        const f = 0.13, d = 0.11;
        lb('frame', ax, a, b, c - d, c + d, sill, sill + f);
        lb('frame', ax, a, b, c - d, c + d, head - f, head);
        lb('frame', ax, a, a + f, c - d, c + d, sill + f, head - f);
        lb('frame', ax, b - f, b, c - d, c + d, sill + f, head - f);
        if (o.type === 'win') {
          const panes = Math.max(1, Math.round((b - a) / 2.3));
          for (let i = 1; i < panes; i++) {
            const u = a + ((b - a) * i) / panes;
            lb('frame', ax, u - 0.05, u + 0.05, c - d, c + d, sill + f, head - f);
          }
          lb('glass', ax, a + f, b - f, c - 0.015, c + 0.015, sill + f, head - f);
          lb('quartz', ax, a - 0.12, b + 0.12, t0 - 0.1, t1 + 0.1, sill - 0.09, sill);
        } else {
          lb('frost', ax, a + f, b - f, c - 0.02, c + 0.02, sill + f, head - f);
        }
        return;
      }
      // doors and cased openings: a teak lining
      const j = 0.1;
      lb('teakV', ax, a, a + j, t0 - 0.03, t1 + 0.03, 0, head);
      lb('teakV', ax, b - j, b, t0 - 0.03, t1 + 0.03, 0, head);
      lb('teakV', ax, a + j, b - j, t0 - 0.03, t1 + 0.03, head - j, head);
      if (o.type === 'open') return;
      const glazed = o.type === 'gdoor', w = b - a - 2 * j, th = 0.07;
      if (!o.isOpen) {
        leaf(ax, a + j, b - j, c - th, c + th, 0.03, head - j, glazed);
      } else {
        const h = o.hinge === 'a' ? a + j + th : b - j - th;
        if (o.swing > 0) leaf(ax, h - th, h + th, t1, t1 + w, 0.03, head - j, glazed);
        else leaf(ax, h - th, h + th, t0 - w, t0, 0.03, head - j, glazed);
      }
    }

    // --- walls ------------------------------------------------------------
    for (const w of P.walls) {
      const [x0, y0, x1, y1] = w.r;
      let z0 = w.z ? w.z[0] : 0;
      const z1 = w.z ? w.z[1] : H, mk = w.mat || 'wall', ax = w.ax;
      if (z0 === 0) z0 = -0.02;
      const lo = ax === 'x' ? x0 : y0, hi = ax === 'x' ? x1 : y1;
      const t0 = ax === 'x' ? y0 : x0, t1 = ax === 'x' ? y1 : x1;
      const ops = (w.ops || []).slice().sort((p, q) => p.a - q.a);
      let cur = lo;
      for (const o of ops) {
        lb(mk, ax, cur, o.a, t0, t1, z0, z1);
        if (o.sill > 0) lb(mk, ax, o.a, o.b, t0, t1, z0, o.sill);
        lb(mk, ax, o.a, o.b, t0, t1, o.head, z1);
        opening(ax, t0, t1, o);
        cur = o.b;
      }
      lb(mk, ax, cur, hi, t0, t1, z0, z1);
    }

    for (const p of P.pillars) box(p.mat, p.r[0], p.r[1], p.r[2], p.r[3], p.z[0] === 0 ? -0.02 : p.z[0], p.z[1]);

    // --- slabs, floors, ceilings -------------------------------------------
    for (const s of P.slabs) box('marble', s[0], s[1], s[2], s[3], -SLAB, -0.02);
    for (const f of P.floors) box(f[4], f[0], f[1], f[2], f[3], -0.02, 0);
    for (const c of P.ceilings) box('ceiling', c[0], c[1], c[2], c[3], H, H + SLAB, 'ceil');

    // --- main stair (down, round the void) ---------------------------------
    const TH = 0.56; // step thickness: reads as a folded-plate stair
    for (let i = 0; i < 7; i++) { // flight 1, heading south
      const top = -(i + 1) * RISE;
      box('stair', 20.29 + i * TREAD, 24.375, 20.29 + (i + 1) * TREAD + 0.02, 27.875, top - TH, top);
    }
    box('stair', 26.125, 23.96, 29.625, 27.875, -8 * RISE - TH, -8 * RISE);
    for (let j = 0; j < 7; j++) { // flight 2, heading east
      const top = -(9 + j) * RISE;
      box('stair', 26.125, 23.96 - (j + 1) * TREAD - 0.02, 29.625, 23.96 - j * TREAD, top - TH, top);
    }

    for (let k = 0; k < 3; k++) { // flight 3, heading north

      box('stair', 26.125 - (k + 1) * TREAD - 0.02, 14.625, 26.125 - k * TREAD, 18.125, top - TH, top);
    }

    // --- feature finishes ---------------------------------------------------
    box('cladding', 29.56, 14.625, 29.625, 27.875, GF, H);            // tall south wall of the void

    // --- placeholder ground floor -------------------------------------------
    box('marble', 9, 14.25, 29.625, 28.25, GF - 0.3, GF);
    box('wall', -1, 0, 29.625, 14.25, GF, -SLAB);           // solid mass under the rear block
    box('wall', -0.375, 14.625, 9, 28.625, GF, -SLAB);      // under the lounge
    box('wall', 8.875, 28.25, 29.625, 47, GF, -SLAB);       // under the master suite

    // --- pergola over the cut-out beside the terrace ------------------------
    // Pergola over the road end of the terrace (it used to cover an open gap there).
    const ter = P.areaById.terrace;
    if (ter && ter.r[3] - ter.r[1] > 12 && ter.r[2] - ter.r[0] > 5) {
      const pg = H - 0.45, pt = H + SLAB, x0 = ter.r[0] + 0.5, x1 = ter.r[2] - 0.35, y1 = ter.r[3] - 0.2, y0 = y1 - 7.8;
      box('teak', x0, y0, x1, y0 + 0.4, pg, pt);
      box('teak', x0, y1 - 0.4, x1, y1, pg, pt);
      box('teak', x0, y0, x0 + 0.4, y1, pg, pt);
      box('teak', x1 - 0.4, y0, x1, y1, pg, pt);
      const nb = Math.max(2, Math.round((y1 - y0) / 2.6));
      for (let k = 1; k < nb; k++) { const y = y0 + ((y1 - y0) * k) / nb; box('teak', x0, y - 0.18, x1, y + 0.18, pg, pt); }

      P.solids.push([Math.min(p[0], q[0]) - 0.06, Math.min(p[1], q[1]) - 0.06, Math.max(p[0], q[0]) + 0.06, Math.max(p[1], q[1]) + 0.06, Math.min(p[2], q[2]) - 0.5, Math.max(p[2], q[2]) + h]);
      const g = new T.BufferGeometry();
      const v = [p[0], p[2] + 0.12, p[1], q[0], q[2] + 0.12, q[1], q[0], q[2] + h, q[1], p[0], p[2] + h, p[1]];
      g.setAttribute('position', new T.Float32BufferAttribute(v, 3));
      g.setAttribute('uv', new T.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
      g.setIndex([0, 1, 2, 0, 2, 3]);
      g.computeVertexNormals();
      const m = new T.Mesh(g, M.railglass);
      m.renderOrder = 6;
      extra.push(m);
      // handrail
      const a = new T.Vector3(p[0], p[2] + h, p[1]), b = new T.Vector3(q[0], q[2] + h, q[1]);

      shoe.lookAt(b0);
      extra.push(shoe);
    }
    const e = 0.1;

      const c = s.c - e * s.n;
      if (s.dir === 'y') {
        glassRun([c, s.a - e, 0], [c, s.b + e, 0]);
        box('fluted', Math.min(s.c, s.c + 0.045 * s.n), s.a, Math.max(s.c, s.c + 0.045 * s.n), s.b, -SLAB - 0.35, 0);
      } else {
        glassRun([s.a - e, c, 0], [s.b + e, c, 0]);
        box('fluted', s.a, Math.min(s.c, s.c + 0.045 * s.n), s.b, Math.max(s.c, s.c + 0.045 * s.n), -SLAB - 0.35, 0);
      }

    glassRun([20.29, 24.375 + e, 0], [26.125 + e, 24.375 + e, -8 * RISE]);      // flight 1
    glassRun([26.125 + e, 24.375 + e, -8 * RISE], [26.125 + e, 23.96, -8 * RISE]);
    glassRun([26.125 + e, 23.96, -8 * RISE], [26.125 + e, 18.125 + e, -16 * RISE]); // flight 2

    // --- outdoor jaali railings ---------------------------------------------
    function jaaliRun(xa, ya, xb, yb, h) {

      P.solids.push([Math.min(xa, xb) - 0.07, Math.min(ya, yb) - 0.07, Math.max(xa, xb) + 0.07, Math.max(ya, yb) + 0.07, 0, h]);
      const alongX = Math.abs(xb - xa) > Math.abs(yb - ya);
      const len = alongX ? Math.abs(xb - xa) : Math.abs(yb - ya);

      if (alongX) {

        box('metal', xa - t, y0, xa + t, y1, 0.18, 0.3);
        const n = Math.max(1, Math.round(len / 4.5));

    const cb = (mk, x0, y0, x1, y1, z0, z1) => box(mk, x0, y0, x1, y1, z0, z1, 'ctx');

    cb('road', -140, 54.5, 170, 78, GF - 2, GF - 0.45);
    cb('ground', -140, 78, 170, 200, GF - 2, GF - 0.3);

    cb('stone', 15.88, 54.1, 30.375, 54.5, GF - 0.3, GF + 5);
    cb('stone', 0, 52.8, 0.46, 54.5, GF - 0.3, GF + 6);
    cb('stone', 13.64, 53.65, 15.88, 54.5, GF - 0.3, GF + 6);
    cb('stone', 0, 47, 0.375, 52.8, GF - 0.3, GF + 5);
    cb('stone', 0, 39, 0.375, 46.25, GF - 0.3, GF + 5);
    cb('stone', 29.625, 50.54, 30.375, 54.5, GF - 0.3, GF + 5);

    cb('metal', 0.46, 54.18, 13.64, 54.34, GF + 4.8, GF + 5);
    cb('metal', 0.46, 54.18, 13.64, 54.34, GF + 0.2, GF + 0.4);

    nb('nb1', 30.4, 2, 58, 46, 11);
    nb('nb2', -74, 2, -44, 40, 22);
    nb('nb3', -34, 84, -6, 122, 23);
    nb('nb1', 0, 86, 28, 124, 33);
    nb('nb2', 34, 84, 62, 120, 22);
    nb('nb3', 68, 86, 98, 122, 30);
    nb('nb1', -70, 84, -40, 120, 26);
    nb('nb2', -4, -86, 30, -50, 23);
    nb('nb3', 36, -88, 66, -52, 32);
    nb('nb1', -44, -84, -10, -50, 20);
    // windows on the facing sides of the houses across the road

          cb('nbwin', x, fy - 0.06, x + 4, fy + 0.4, GF + fl * 10.5 + 3.5, GF + fl * 10.5 + 8);
          cb('nb1', x - 0.3, fy - 0.5, x + 4.3, fy + 0.2, GF + fl * 10.5 + 8, GF + fl * 10.5 + 8.4);
        }

    B.flush(groups);
    for (const m of extra) groups.main.add(m);

    // trees along the road
    const trunkG = new T.CylinderGeometry(0.5, 0.7, 9, 8);
    const crownG = new T.IcosahedronGeometry(5.5, 1);
    for (const [x, y, s] of [[-14, 81, 1], [16, 81.5, 1.2], [44, 81, 0.9], [72, 82, 1.1], [-46, 81, 1], [-12, 58, 0.8], [40, 58.5, 0.9], [-17, 21, 1.0], [-16, -13, 0.9], [9, -21, 1.1], [27, -23, 0.95], [-19, 41, 0.85], [-30, 6, 1.1], [44, -30, 1.0]]) {

      tr.position.set(x, GF + 4.5 * s, y);

      groups.ctx.add(tr);
      for (const [dx, dy, dz, r] of [[0, 12, 0, 1], [3, 10, 2, 0.75], [-3, 10.5, -1.5, 0.8], [0.5, 14.5, -1, 0.7]]) {
        const cr = new T.Mesh(crownG, dx > 0 ? M.leaf2 : M.leaf);
        cr.position.set(x + dx * s, GF + dy * s, y + dz * s);
        cr.scale.setScalar(r * s);
        cr.castShadow = true;
        groups.ctx.add(cr);

    }

    scene.add(groups.main, groups.ceil, groups.ctx);
    A.groups = groups;
    return groups;
  };
})();

<script>
/* ---- js/furniture.js ---- */
/* Furniture and fittings, built from simple shapes and sized to each room.

(function () {

    const TAP = { modern: 'black', scandi: 'chrome', luxury: 'brass' }[STYLE];  // taps, rails, shower fittings

    function lampV() {

        g.add(cyl(0.45, 0.45, 0.05, M.black, 0, 0, 0)); g.add(cyl(0.03, 0.03, 5.4, M.black, 0, 0.05, 0, 8));
        g.add(bx(1.5, 0.05, 0.05, M.black, 0.72, 5.4, 0)); g.add(cyl(0.28, 0.34, 0.3, M.black, 1.45, 5.1, 0, 20));

        for (const sx of [-1, 1]) { g.add(bx(0.07, 1.3, 0.07, M.black, sx * 0.66, 0, 0.6)); g.add(bx(0.07, 2.6, 0.07, M.black, sx * 0.66, 0, -0.62)); g.add(bx(0.07, 0.07, 1.3, M.black, sx * 0.66, 0, 0)); }

<script>
/* ---- js/lighting.js ---- */
/* Sky, late-afternoon west sun with shadows, and warm interior lights. */
(function () {
  const A = (window.APP = window.APP || {});
  const T = THREE;

  A.buildLighting = function (scene, renderer) {
    const P = A.plan, H = P.H, GF = P.GF;
    // The front of the house faces west (+z here). About 4:30 pm: low sun, west-south-west.
    const sunDir = new T.Vector3(0.36, 0.42, 0.83).normalize();
    A.sunDir = sunDir;

    const skyMat = new T.ShaderMaterial({
      side: T.BackSide,
      depthWrite: false,
      uniforms: { sun: { value: sunDir }, gain: { value: 1 } },
      vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: [
        'varying vec3 vDir; uniform vec3 sun; uniform float gain;',
        'void main(){',
        '  vec3 d = normalize(vDir);',
        '  vec3 zen = vec3(0.23,0.42,0.74); vec3 hor = vec3(0.95,0.78,0.60); vec3 gnd = vec3(0.50,0.46,0.40);',
        '  vec3 c = mix(hor, zen, pow(clamp(d.y,0.0,1.0), 0.5));',
        '  c = mix(c, gnd, smoothstep(0.0,-0.10,d.y));',
        '  float s = max(dot(d,sun),0.0);',
        '  c += vec3(1.0,0.70,0.40)*pow(s,5.0)*0.45 + vec3(1.0,0.92,0.78)*pow(s,600.0)*6.0;',
        '  gl_FragColor = vec4(c*gain,1.0);',
        '  #include <tonemapping_fragment>',
        '  #include <colorspace_fragment>',
        '}',
      ].join('\n'),
    });
    const sky = new T.Mesh(new T.SphereGeometry(1200, 32, 16), skyMat);
    sky.name = 'sky';
    scene.add(sky);

    // A dimmed copy of the sky drives reflections on glass, marble and metal.
    try {
      const pm = new T.PMREMGenerator(renderer);
      const envScene = new T.Scene();
      const envMat = skyMat.clone();
      envMat.uniforms = { sun: { value: sunDir }, gain: { value: 0.34 } };
      envScene.add(new T.Mesh(sky.geometry, envMat));
      scene.environment = pm.fromScene(envScene, 0, 1, 3000).texture;
      pm.dispose();
    } catch (err) { console.warn('environment map skipped', err); }

    const hemi = new T.HemisphereLight(0xdde7ff, 0xcbb596, 0.42);
    scene.add(hemi);

    const sun = new T.DirectionalLight(0xffd0a0, 5.2);
    const target = new T.Vector3(14, 0, 26);
    sun.position.copy(target).addScaledVector(sunDir, 130);
    sun.target.position.copy(target);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    const sc = sun.shadow.camera;
    sc.left = -50; sc.right = 50; sc.top = 50; sc.bottom = -50; sc.near = 20; sc.far = 260;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.05;
    scene.add(sun, sun.target);
    A.sun = sun;

    // Interior lights: [x, y, height, intensity, reach]
    const lamps = [
      [5, 6, 8.3, 46, 24],         // living seating
      [14.3, 7.9, 6.1, 34, 20],    // dining pendant
      [23.2, 5.6, 8.8, 32, 17],    // kitchen
      [23, 11.3, 8.8, 20, 13],     // common washroom
      [4.6, 21, 8.4, 34, 20],      // lounge
      [P.voidCenter[0], P.voidCenter[1], 3.4, 95, 34], // chandelier in the void
      [14, 26.2, 8.6, 16, 14],     // gallery
      [15.5, 36.5, 8.4, 40, 24],   // master bedroom
      [25.6, 41.4, 8.6, 15, 12],   // dress
      [25.6, 34, 8.6, 22, 14],     // master toilet
      [16, 20, GF + 7.5, 38, 26],  // placeholder room below
    ];
    /* Only the few lamps nearest the viewer are switched on at any moment. The
       picture looks the same, but each frame costs much less to draw. A lamp
       fades out as it becomes the furthest of the set, so nothing pops. */
    const POOL = 4, pool = [], order = lamps.map((l, i) => i), dist = lamps.map(() => 0);
    for (let k = 0; k < POOL; k++) { const l = new T.PointLight(0xffd8a8, 0, 30, 2); scene.add(l); pool.push(l); }
    const OVERVIEW = [0, 4, 5, 7];
    A.updateLights = function (p, overview) {
      for (let i = 0; i < lamps.length; i++) dist[i] = overview ? (OVERVIEW.indexOf(i) < 0 ? 1e6 : OVERVIEW.indexOf(i)) : Math.hypot(lamps[i][0] - p.x, lamps[i][2] - p.y, lamps[i][1] - p.z);
      order.sort((a, b) => dist[a] - dist[b]);
      const edge = dist[order[POOL]];
      for (let k = 0; k < POOL; k++) {
        const L = lamps[order[k]], w = overview ? 1 : Math.max(0, Math.min(1, (edge - dist[order[k]]) / 6));
        pool[k].position.set(L[0], L[2], L[1]);
        pool[k].intensity = L[3] * w;
        pool[k].distance = L[4];
      }
    };
    A.updateLights(new T.Vector3(17, 5, 26), false);

    // Recessed downlights (visual only) as small glowing squares in the ceiling.
    const B = new A.Batcher();
    const spots = [];
    const grid = (x0, y0, x1, y1, nx, ny) => {
      for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++)
        spots.push([x0 + ((x1 - x0) * (i + 0.5)) / nx, y0 + ((y1 - y0) * (j + 0.5)) / ny]);
    };
    grid(0.5, 1.2, 18.5, 13.4, 4, 3);     // living
    grid(20, 3.3, 27.2, 7.7, 3, 2);       // kitchen
    grid(20.2, 9, 26, 13.6, 2, 2);        // common washroom
    spots.push([28.4, 10.5]);
    grid(1, 15.6, 8.6, 27, 2, 3);         // lounge
    grid(10.4, 25.2, 26, 27.2, 4, 1);     // gallery and stair
    grid(10.2, 29.4, 21.4, 45.2, 3, 4);   // bedroom
    grid(23.4, 39, 28.4, 43.6, 2, 2);     // dress
    grid(23.4, 29.2, 28.6, 37, 2, 3);     // master toilet
    for (const [x, y] of spots) B.box('glow', x - 0.17, y - 0.17, x + 0.17, y + 0.17, H - 0.035, H + 0.01, 'ceil');
    B.flush(A.groups);
  };
})();

      g.strokeStyle = 'rgba(244,239,230,0.28)'; g.lineWidth = 1;
      for (let i = 0; i <= 7; i++) { const x = MX(20.29 + i * P.TREAD); g.beginPath(); g.moveTo(x, MY(24.375)); g.lineTo(x, MY(27.875)); g.stroke(); }
      for (let i = 0; i <= 7; i++) { const y = MY(23.96 - i * P.TREAD); g.beginPath(); g.moveTo(MX(26.125), y); g.lineTo(MX(29.625), y); g.stroke(); }
      g.fillStyle = '#f4efe6';
      for (const w of P.walls) {
        const z0 = w.z ? w.z[0] : 0, z1 = w.z ? w.z[1] : P.H;
        if (z1 < 3 || z0 > 1) continue;
        const [x0, y0, x1, y1] = w.r, ops = (w.ops || []).slice().sort((a, b) => a.a - b.a);
        let cur = w.ax === 'x' ? x0 : y0;
        const end = w.ax === 'x' ? x1 : y1;
        const seg = (a, b, thin) => {
          if (b - a < 0.01) return;
          g.globalAlpha = thin ? 0.45 : 1;
          if (w.ax === 'x') g.fillRect(MX(a), MY(y0), (b - a) * MS, Math.max(1.5, (y1 - y0) * MS));
          else g.fillRect(MX(x0), MY(a), Math.max(1.5, (x1 - x0) * MS), (b - a) * MS);
          g.globalAlpha = 1;
        };
        for (const o of ops) { seg(cur, o.a); if (o.type === 'win' || o.type === 'vent') seg(o.a, o.b, true); cur = o.b; }
        seg(cur, end);
      }
      for (const p of P.pillars) g.fillRect(MX(p.r[0]), MY(p.r[1]), (p.r[2] - p.r[0]) * MS, (p.r[3] - p.r[1]) * MS);
    })();
    function drawMap() {
      mctx.clearRect(0, 0, MW, MH);
      mctx.drawImage(base, 0, 0);
      if (st.mode === 'overview') return;
      const x = MX(pos.x), y = MY(pos.z), sn = -Math.sin(st.yaw), cs = -Math.cos(st.yaw);
      mctx.fillStyle = 'rgba(210,168,92,0.28)';
      mctx.beginPath();
      mctx.moveTo(x, y);
      mctx.arc(x, y, 44, Math.atan2(cs, sn) - 0.55, Math.atan2(cs, sn) + 0.55);
      mctx.closePath();
      mctx.fill();
      mctx.fillStyle = '#d2a85c';
      mctx.beginPath(); mctx.arc(x, y, 6.5, 0, 6.3); mctx.fill();
      mctx.strokeStyle = '#1d1712'; mctx.lineWidth = 2; mctx.stroke();
    }

    // --- per-frame update ---------------------------------------------------------
    const ovC = new T.Vector3(14.5, 0, 25);
    let uiTick = 0;
    function tick(dt) {
      if (st.mode === 'tour' && st.playing) {
        st.t += dt;
        if (st.t >= total) {
          st.t = total; st.mode = 'hold-end';
          fadeThen(() => { st.ov = 0; showOverview(true); });
        } else {
          poseAt(st.t, false, dt);
          if (blend.k < 1) {
            blend.k = Math.min(1, blend.k + dt / 0.9);
            const e = blend.k * blend.k * (3 - 2 * blend.k);
            pos.lerpVectors(blend.p, pos, e);
          }
        }
        applyCam();
      } else if (st.mode === 'overview') {
        if (st.playing) st.ov += dt;
        if (st.ov >= OV && !st.ended) { st.ended = true; setPlaying(false); elEnd.style.display = 'block'; }
        const az = st.doll ? st.az : 0.35 + 0.05 * Math.min(st.ov, OV + 60), el = st.doll ? st.el : 0.9, R = st.doll ? 92 : 86;
        camera.position.set(ovC.x + R * Math.cos(el) * Math.sin(az), R * Math.sin(el), ovC.z + R * Math.cos(el) * Math.cos(az));
        camera.lookAt(ovC);
      } else if (st.mode === 'free') {
        freeStep(dt);
        applyCam();
      } else {
        applyCam();
      }
      // progress, chips, caption, map (every third frame is plenty)
      if (uiTick++ % 3) return;
      setDollLabel();
      const tt = st.mode === 'overview' ? total + Math.min(st.ov, OV) : st.t;
      elFill.style.width = ((tt / (total + OV)) * 100).toFixed(2) + '%';
      elTime.textContent = fmt(tt) + ' / ' + fmt(total + OV);
      let cur = -1;
      for (let i = 0; i < stops.length; i++) if (tt >= stops[i].t - 0.05) cur = i;
      chips.forEach((c, i) => c.classList.toggle('on', i === cur && (st.playing || st.mode === 'overview')));
      caption();
      drawMap();
    }

    if (window.PLAN_SOURCE) { // single-file build: say where the layout came from
      const n0 = document.getElementById('notice');
      if (n0) {
        n0.textContent = window.PLAN_SOURCE === 'editor' ? "Layout read from the plan editor's file." : 'Layout: the copy built into this file (editor file not found).';
        n0.style.display = 'block';
        setTimeout(() => { n0.style.display = 'none'; }, 9000);
      }
    }
    if (A.planEdited) {
      const n = document.getElementById('notice');
      if (n) {
        const hit = A.checkTour().length > 0;
        n.innerHTML = (hit ? 'Edited plan in use. Part of the guided tour now passes through a wall; free walking still works. ' : 'Edited plan in use. ') + '<a href="editor.html">Open editor</a>';
        n.style.display = 'block';
      }
    }
    const ed = document.getElementById('editlink');
    if (ed) ed.addEventListener('click', () => { ed.href = 'editor.html?t=' + Date.now(); });
    // start standing on the stair landing, ready to play
    enterTour(0, true);
    st.mode = 'free';
    setPlaying(false);
    applyCam();
    const q = new URLSearchParams(location.search);
    if (q.get('stop')) A.jump(q.get('stop'));
    if (q.get('play') === '1') { st.mode = 'tour'; setPlaying(true); }
    return tick;
  };
})();

</script>
<script>
/* ---- js/main.js ---- */
/* Start-up: renderer, scene, render loop. Add ?debug=plan to the address for a
   top view with the original drawing laid over the model. */
(function () {
  const A = (window.APP = window.APP || {});

  function start() {
    const msg = document.getElementById('loadmsg');
    if (!window.THREE) {
      msg.textContent = 'The 3D library could not be loaded. Please check the internet connection and reload.';
      return;
    }
    const T = THREE;
    const canvas = document.getElementById('view');
    let renderer;
    try {
      renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    } catch (err) {
      msg.textContent = 'This browser could not start 3D graphics (WebGL).';
      return;
    }
    const PR_MAX = Math.min(window.devicePixelRatio || 1, 1.5);
    let pr = Math.min(PR_MAX, 1.25);
    renderer.setPixelRatio(pr);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFShadowMap;
    // Nothing in the scene moves, so the sun's shadows are drawn once, not every frame.
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;
    A.refreshShadows = () => { renderer.shadowMap.needsUpdate = true; };
    renderer.toneMapping = T.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(64, 1, 0.25, 3000);
    A.scene = scene; A.camera = camera; A.renderer = renderer;

    const params = new URLSearchParams(location.search);
    const debug = params.get('debug');

    A.buildMaterials();
    if (A.setStyle) { A.setStyle(params.get('style') || 'luxury'); A.bindStyleButtons(); }
    A.buildShell(scene);
    if (A.buildFurniture && debug !== 'plan') A.buildFurniture(scene);
    A.buildLighting(scene, renderer);

    // Mirrors: photograph each room once from its middle and use that as the reflection.
    function mirrorShots() {
      const shots = [['mirror', 24.6, 41.2], ['mirror2', 25.6, 34.6], ['mirror3', 23.2, 12.4]];
      const hidden = [];
      scene.traverse((o) => { if (o.isMesh && shots.some((s) => A.M[s[0]] === o.material)) hidden.push(o); });
      hidden.forEach((o) => (o.visible = false));
      for (const [key, x, y] of shots) {
        const rt = new T.WebGLCubeRenderTarget(256, { generateMipmaps: true, minFilter: T.LinearMipmapLinearFilter });
        const cc = new T.CubeCamera(0.2, 400, rt);
        cc.position.set(x, 4.6, y);
        A.updateLights(cc.position, false);
        scene.add(cc);
        cc.update(renderer, scene);
        scene.remove(cc);
        A.M[key].envMap = rt.texture;
        A.M[key].needsUpdate = true;
      }
      hidden.forEach((o) => (o.visible = true));
    }
    if (debug !== 'plan') { try { mirrorShots(); } catch (err) { console.warn('mirror reflections skipped', err); } }
    // A style changes the furniture itself, not only its colours: rebuild it, then refresh mirrors and shadows.
    A.onStyle = () => {
      if (debug === 'plan') return;
      const old = A.groups.furn;
      if (old) { scene.remove(old); old.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
      A.buildFurniture(scene);
      try { mirrorShots(); } catch (err) { /* keep the old reflections */ }
      A.refreshShadows();
    };

    let render = () => renderer.render(scene, camera);
    let tick = null;

    if (debug === 'plan') {
      document.body.classList.add('debug');
      // Top view: nearer surfaces (wall tops) are lighter, the drawing is laid over.
      A.groups.ceil.visible = false;
      A.groups.ctx.visible = false;
      scene.getObjectByName('sky').visible = false;
      const ortho = new T.OrthographicCamera(-1, 1, 1, -1, 20.2, 32.5);
      ortho.position.set(14.7, 31, 26.5);
      ortho.up.set(0, 0, -1);
      ortho.lookAt(14.7, 0, 26.5);
      scene.overrideMaterial = new T.MeshDepthMaterial();
      const over = new T.Scene();
      const img = new T.TextureLoader().load('debug/plan.png');
      img.colorSpace = T.SRGBColorSpace;
      // sheet is 595 x 842 pt; 11.307 pt per foot; plot corner at (131.6, 79.35) pt
      const K = 11.307, w = 595 / K, h = 842 / K, x0 = -131.6 / K, y0 = -79.35 / K;
      const pl = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ map: img, transparent: true, opacity: Number(params.get('o') || 0.55) }));
      pl.rotation.x = -Math.PI / 2;
      pl.position.set(x0 + w / 2, 10.5, y0 + h / 2);
      over.add(pl);
      const zoom = Number(params.get('z') || 1), cx = Number(params.get('cx') || 14.7), cy = Number(params.get('cy') || 26.5);
      ortho.position.set(cx, 31, cy);
      render = () => {
        const a = canvas.clientWidth / canvas.clientHeight, half = 31 / zoom;
        ortho.left = -half * a; ortho.right = half * a; ortho.top = half; ortho.bottom = -half;
        ortho.updateProjectionMatrix();
        renderer.autoClear = true;
        renderer.shadowMap.enabled = false;
        renderer.render(scene, ortho);
        renderer.autoClear = false;
        renderer.render(over, ortho);
      };
    } else if (A.initTour) {
      tick = A.initTour({ scene, camera, renderer, canvas });
    } else {
      camera.position.set(14, 5.25, 26);
      camera.lookAt(14, 4, 18);
    }

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.fov = w >= h ? 64 : 78;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    let last = performance.now(), acc = 0, count = 0, warm = 0;
    A.perf = { fps: 0, pr };
    function frame(now) {
      const raw = (now - last) / 1000, dt = Math.min(0.1, raw);
      last = now;
      if (tick) tick(dt);
      if (A.updateLights && !debug) A.updateLights(camera.position, camera.position.y > 30);
      render();
      // Keep the motion smooth: if frames are slow, draw at a lower resolution; if
      // there is headroom, sharpen up again.
      if (raw < 0.5 && ++warm > 40) {
        acc += raw; count++;
        if (count >= 24) {
          const avg = acc / count;
          acc = 0; count = 0;
          A.perf.fps = Math.round(1 / avg);
          let next = pr;
          if (avg > 1 / 42 && pr > 0.6) next = Math.max(0.6, pr * 0.85);
          else if (avg < 1 / 56 && pr < PR_MAX) next = Math.min(PR_MAX, pr * 1.08);
          if (next !== pr) { pr = next; A.perf.pr = pr; renderer.setPixelRatio(pr); renderer.setSize(canvas.clientWidth, canvas.clientHeight, false); }
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    A.renderOnce = () => { if (tick) tick(0); if (A.updateLights && !debug) A.updateLights(camera.position, camera.position.y > 30); render(); };
    A.step = (dt) => { if (tick) tick(dt); if (A.updateLights && !debug) A.updateLights(camera.position, camera.position.y > 30); render(); }; // advance by hand, for checking

    const ld = document.getElementById('loading');
    ld.classList.add('hide');
    setTimeout(() => (ld.style.display = 'none'), 700);
    A.ready = true;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
</body>
